[package]
name = "zen-canvas-windows-preview-handler-harness"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zen-canvas-windows-preview-handler-harness"
path = "src/main.rs"

[[bin]]
name = "zen-canvas-windows-preview-dll-servicing-smoke"
path = "src/preview_dll_servicing_smoke.rs"

[dependencies]
zen-canvas-windows-preview-registration = { path = "../windows-preview-registration" }
windows-core = "0.61.2"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_Marshal",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls_RichEdit",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
