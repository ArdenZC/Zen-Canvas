name: Windows Package Diagnostic

on:
  push:
    branches:
      - agent/system-wide-search-hardening

permissions:
  contents: read

concurrency:
  group: windows-package-diagnostic-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package:
    name: Windows NSIS package diagnostic
    runs-on: windows-latest
    steps:
      - name: Checkout final source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Rust and Cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            src-tauri -> target
          shared-key: zen-canvas-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'rust-toolchain', 'rust-toolchain.toml') }}
          cache-targets: true
          cache-all-crates: true
          cache-on-failure: true
      - name: Install dependencies
        run: npm ci
      - name: Build Windows production package
        id: package
        shell: pwsh
        run: |
          cmd /c "npm run build > windows-package.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content windows-package.log
          "exit_code=$code" >> $env:GITHUB_OUTPUT
          exit 0
      - name: Upload package log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-package-log-${{ github.sha }}
          path: windows-package.log
          if-no-files-found: error
          retention-days: 30
      - name: Preserve package result
        shell: pwsh
        run: |
          if ('${{ steps.package.outputs.exit_code }}' -ne '0') { exit 1 }
