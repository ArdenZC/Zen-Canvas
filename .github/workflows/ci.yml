name: CI

on:
  pull_request: {}
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-interactive-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  change-scope:
    name: Change scope / routing contract
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      frontend_changed: ${{ steps.classify.outputs.frontend_changed }}
      rust_changed: ${{ steps.classify.outputs.rust_changed }}
      macos_sensitive: ${{ steps.classify.outputs.macos_sensitive }}
      performance_sensitive: ${{ steps.classify.outputs.performance_sensitive }}
      high_risk: ${{ steps.classify.outputs.high_risk }}
      package_sensitive: ${{ steps.classify.outputs.package_sensitive }}
      dependency_sensitive: ${{ steps.classify.outputs.dependency_sensitive }}
      release_sensitive: ${{ steps.classify.outputs.release_sensitive }}
      all_domains_100k: ${{ steps.classify.outputs.all_domains_100k }}
      workflow_changed: ${{ steps.classify.outputs.workflow_changed }}
      base_missing: ${{ steps.classify.outputs.base_missing }}
      full_validation: ${{ steps.classify.outputs.full_validation }}
      perf_search: ${{ steps.classify.outputs.perf_search }}
      perf_scan_schema: ${{ steps.classify.outputs.perf_scan_schema }}
      perf_library_content: ${{ steps.classify.outputs.perf_library_content }}
      perf_intelligence: ${{ steps.classify.outputs.perf_intelligence }}
      perf_workspace_foundation: ${{ steps.classify.outputs.perf_workspace_foundation }}
      performance_any: ${{ steps.classify.outputs.performance_any }}
      diff_base: ${{ steps.classify.outputs.diff_base }}
      diff_head: ${{ steps.classify.outputs.diff_head }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          EVENT_HEAD: ${{ github.sha }}
          DISPATCH_FULL: "false"
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/classifyCiChanges.mjs
      - name: Validate project governance
        run: npm run test:governance

  docs-only:
    name: Documentation-only validation
    needs: change-scope
    if: ${{ needs.change-scope.outputs.docs_only == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate documentation-only change
        env:
          DOCS_DIFF_BASE: ${{ needs.change-scope.outputs.diff_base }}
          DOCS_DIFF_HEAD: ${{ needs.change-scope.outputs.diff_head }}
        run: |
          npm run test:docs
          git diff --check "$DOCS_DIFF_BASE" "$DOCS_DIFF_HEAD"

  frontend-quality:
    name: Frontend and format quality
    needs: change-scope
    if: ${{ needs.change-scope.outputs.frontend_changed == 'true' }}
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp-tests/playwright-browsers
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .tmp-tests/playwright-browsers
          key: zen-canvas-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for W2-01 browser gate
        run: npx playwright install --with-deps chromium
      - name: Frontend tests and architecture checks
        run: |
          npm run typecheck
          npm test
          npm run test:remediation
          npm run test:performance:architecture
      - name: Build frontend
        run: npm run build:frontend
      - name: W2-01 real browser regression gate
        env:
          W201_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run test:browser:w2-01:real
      - name: Upload W2-01 browser gate failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: w2-01-browser-gate-failure
          path: .tmp-tests/w2-01-browser-gate
          if-no-files-found: ignore

  rust-windows:
    name: Rust quality (windows-latest)
    needs: change-scope
    if: ${{ needs.change-scope.outputs.rust_changed == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: zen-canvas-Windows-v2
          cache-workspace-crates: true
          cache-targets: true
          cache-on-failure: true
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime
      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --features desktop-runtime --all-targets -- -D warnings
      - name: Native filesystem hardening smoke
        run: cargo test --manifest-path src-tauri/Cargo.toml --features "desktop-runtime native-qa" --test native_file_hardening_smoke -- --ignored --nocapture --test-threads=1

  rust-macos:
    name: Rust quality (macos-latest)
    needs: change-scope
    if: ${{ needs.change-scope.outputs.macos_sensitive == 'true' }}
    runs-on: macos-latest
    env:
      ZEN_CANVAS_MACOS_RACE_ITERATIONS: "10000"
      ZEN_CANVAS_MACOS_EXPANDED_RACE_ITERATIONS: "10000"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          sw_vers
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = "aarch64-apple-darwin"
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: zen-canvas-macOS-v2
          cache-workspace-crates: true
          cache-targets: true
          cache-on-failure: true
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features "desktop-runtime native-qa"
      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --features "desktop-runtime native-qa" --all-targets -- -D warnings
      - name: macOS path and temp policy regression
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --features "desktop-runtime native-qa" macos_
          cargo test --manifest-path src-tauri/Cargo.toml --features "desktop-runtime native-qa" platform::macos
          cargo test --manifest-path src-tauri/Cargo.toml --features "desktop-runtime native-qa" content::eligibility
          cargo test --manifest-path src-tauri/Cargo.toml --features "desktop-runtime native-qa" --test macos_mutation_fail_closed -- --nocapture --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml --features "desktop-runtime native-qa" --test macos_native_hardening_smoke -- --nocapture --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml --features "desktop-runtime native-qa" temp_safety_tests

  performance-prepare:
    name: Performance / Prepare
    needs: change-scope
    if: ${{ needs.change-scope.outputs.performance_any == 'true' }}
    outputs:
      binary_build_identity: ${{ steps.binary-build-identity.outputs.build_identity }}
      fixture_cache_key: ${{ steps.prepare-artifacts.outputs.fixture_cache_key }}
      fixture_identity: ${{ steps.prepare-artifacts.outputs.fixture_identity }}
      fixture_format_version: ${{ steps.prepare-artifacts.outputs.fixture_format_version }}
    runs-on: windows-latest
    env:
      PERF_SEARCH: ${{ needs.change-scope.outputs.perf_search }}
      PERF_SCAN_SCHEMA: ${{ needs.change-scope.outputs.perf_scan_schema }}
      PERF_LIBRARY_CONTENT: ${{ needs.change-scope.outputs.perf_library_content }}
      PERF_INTELLIGENCE: ${{ needs.change-scope.outputs.perf_intelligence }}
      PERF_WORKSPACE_FOUNDATION: ${{ needs.change-scope.outputs.perf_workspace_foundation }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Compute performance binary build identity
        id: binary-build-identity
        shell: pwsh
        run: node scripts/performanceBuildIdentity.mjs "--profile=${{ needs.change-scope.outputs.full_validation == 'true' && 'full' || 'extended' }}"
      - name: Restore reusable prepared binary cache
        id: binary-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .performance-cache/binaries
          key: zen-canvas-perf-binaries-${{ runner.os }}-${{ runner.arch }}-${{ steps.binary-build-identity.outputs.build_identity }}
      - name: Rust cache
        if: ${{ steps.binary-cache.outputs.cache-hit != 'true' }}
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: zen-canvas-Windows-performance-v3
          add-job-id-key: false
          cache-workspace-crates: true
          cache-targets: true
          cache-on-failure: true
      - name: Report Rust cache state
        if: ${{ steps.binary-cache.outputs.cache-hit != 'true' }}
        run: echo "[perf-prepare] rust-cache=${{ steps.rust-cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"
      - name: Compute reusable fixture identity
        if: ${{ needs.change-scope.outputs.perf_library_content == 'true' }}
        id: fixture-identity
        shell: pwsh
        run: node scripts/performanceFixtureIdentity.mjs "--profile=${{ needs.change-scope.outputs.full_validation == 'true' && 'full' || 'extended' }}"
      - name: Restore reusable fixture cache
        if: ${{ needs.change-scope.outputs.perf_library_content == 'true' }}
        id: fixture-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .tmp-performance-fixtures/cache
          key: ${{ steps.fixture-identity.outputs.fixture_cache_key }}
      - name: Prepare performance binaries and fixtures
        id: prepare-artifacts
        shell: pwsh
        run: |
          node scripts/preparePerformanceBinaries.mjs "--profile=${{ needs.change-scope.outputs.full_validation == 'true' && 'full' || 'extended' }}" "--cache-root=.performance-cache/binaries" "--output=.performance-artifacts/binaries"
          if ("${{ needs.change-scope.outputs.perf_library_content }}" -eq "true") {
            node scripts/preparePerformanceFixtures.mjs "--profile=${{ needs.change-scope.outputs.full_validation == 'true' && 'full' || 'extended' }}" "--prepared-binaries=.performance-artifacts/binaries" "--cache-root=.tmp-performance-fixtures/cache" "--fixture-identity=${{ steps.fixture-identity.outputs.fixture_identity }}"
          }
      - name: Save prepared binary cache
        if: ${{ steps.binary-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .performance-cache/binaries
          key: zen-canvas-perf-binaries-${{ runner.os }}-${{ runner.arch }}-${{ steps.binary-build-identity.outputs.build_identity }}
      - name: Save prepared fixture cache
        if: ${{ needs.change-scope.outputs.perf_library_content == 'true' && steps.fixture-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .tmp-performance-fixtures/cache
          key: ${{ steps.fixture-identity.outputs.fixture_cache_key }}
      - name: Upload Search prepared binaries
        if: ${{ needs.change-scope.outputs.perf_search == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-bin-search
          path: .performance-artifacts/binaries/search
          if-no-files-found: error
          retention-days: 2
      - name: Upload Scan and Schema prepared binaries
        if: ${{ needs.change-scope.outputs.perf_scan_schema == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-bin-scan-schema
          path: .performance-artifacts/binaries/scan-schema
          if-no-files-found: error
          retention-days: 2
      - name: Upload Library and Content prepared binaries
        if: ${{ needs.change-scope.outputs.perf_library_content == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-bin-library-content
          path: .performance-artifacts/binaries/library-content
          if-no-files-found: error
          retention-days: 2
      - name: Upload Intelligence prepared binaries
        if: ${{ needs.change-scope.outputs.perf_intelligence == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-bin-intelligence
          path: .performance-artifacts/binaries/intelligence
          if-no-files-found: error
          retention-days: 2
      - name: Upload Workspace Foundation prepared binaries
        if: ${{ needs.change-scope.outputs.perf_workspace_foundation == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-bin-workspace-foundation
          path: .performance-artifacts/binaries/workspace-foundation
          if-no-files-found: error
          retention-days: 2

  performance-search:
    name: Performance / Search
    needs: [change-scope, performance-prepare]
    if: ${{ needs.change-scope.outputs.perf_search == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Download Search prepared binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: perf-bin-search
          path: .performance-artifacts/binaries
      - name: Run Search performance suite from prepared binary
        shell: pwsh
        run: |
          $performanceTemp = Join-Path $PWD ".performance-temp"
          New-Item -ItemType Directory -Force -Path $performanceTemp | Out-Null
          $env:TEMP = $performanceTemp
          $env:TMP = $performanceTemp
          node scripts/runPerformanceSuite.mjs "--suite=search" "--profile=${{ needs.change-scope.outputs.full_validation == 'true' && 'full' || 'extended' }}" "--prepared-binaries=.performance-artifacts/binaries" "--build-identity=${{ needs.performance-prepare.outputs.binary_build_identity }}"

  performance-scan-schema:
    name: Performance / Scan & Schema
    needs: [change-scope, performance-prepare]
    if: ${{ needs.change-scope.outputs.perf_scan_schema == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Download Scan and Schema prepared binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: perf-bin-scan-schema
          path: .performance-artifacts/binaries
      - name: Run Scan and Schema performance suite from prepared binary
        shell: pwsh
        run: |
          $performanceTemp = Join-Path $PWD ".performance-temp"
          New-Item -ItemType Directory -Force -Path $performanceTemp | Out-Null
          $env:TEMP = $performanceTemp
          $env:TMP = $performanceTemp
          node scripts/runPerformanceSuite.mjs "--suite=scan-schema" "--profile=${{ needs.change-scope.outputs.full_validation == 'true' && 'full' || 'extended' }}" "--prepared-binaries=.performance-artifacts/binaries" "--build-identity=${{ needs.performance-prepare.outputs.binary_build_identity }}"

  performance-library-content:
    name: Performance / Library & Content
    needs: [change-scope, performance-prepare]
    if: ${{ needs.change-scope.outputs.perf_library_content == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Download Library and Content prepared binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: perf-bin-library-content
          path: .performance-artifacts/binaries
      - name: Restore exact Library and Content fixture cache
        id: fixture-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .tmp-performance-fixtures/cache
          key: ${{ needs.performance-prepare.outputs.fixture_cache_key }}
      - name: Require exact Library and Content fixture cache
        shell: pwsh
        run: |
          if ("${{ steps.fixture-cache.outputs.cache-hit }}" -ne "true") { throw "Exact prepared fixture cache was not restored." }
      - name: Run Library and Content performance suite from prepared binary
        shell: pwsh
        run: |
          $performanceTemp = Join-Path $PWD ".performance-temp"
          New-Item -ItemType Directory -Force -Path $performanceTemp | Out-Null
          $env:TEMP = $performanceTemp
          $env:TMP = $performanceTemp
          node scripts/runPerformanceSuite.mjs "--suite=library-content" "--profile=${{ needs.change-scope.outputs.full_validation == 'true' && 'full' || 'extended' }}" "--prepared-binaries=.performance-artifacts/binaries" "--build-identity=${{ needs.performance-prepare.outputs.binary_build_identity }}" "--fixture-root=.tmp-performance-fixtures/cache" "--fixture-identity=${{ needs.performance-prepare.outputs.fixture_identity }}"

  performance-intelligence:
    name: Performance / Intelligence
    needs: [change-scope, performance-prepare]
    if: ${{ needs.change-scope.outputs.perf_intelligence == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Download Intelligence prepared binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: perf-bin-intelligence
          path: .performance-artifacts/binaries
      - name: Run Intelligence performance suite from prepared binary
        shell: pwsh
        run: |
          $performanceTemp = Join-Path $PWD ".performance-temp"
          New-Item -ItemType Directory -Force -Path $performanceTemp | Out-Null
          $env:TEMP = $performanceTemp
          $env:TMP = $performanceTemp
          node scripts/runPerformanceSuite.mjs "--suite=intelligence" "--profile=${{ needs.change-scope.outputs.full_validation == 'true' && 'full' || 'extended' }}" "--prepared-binaries=.performance-artifacts/binaries" "--build-identity=${{ needs.performance-prepare.outputs.binary_build_identity }}"

  performance-workspace-foundation:
    name: Performance / Workspace Foundation
    needs: [change-scope, performance-prepare]
    if: ${{ needs.change-scope.outputs.perf_workspace_foundation == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Download Workspace Foundation prepared binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: perf-bin-workspace-foundation
          path: .performance-artifacts/binaries
      - name: Run Workspace Foundation performance suite from prepared binary
        shell: pwsh
        run: |
          $performanceTemp = Join-Path $PWD ".performance-temp"
          New-Item -ItemType Directory -Force -Path $performanceTemp | Out-Null
          $env:TEMP = $performanceTemp
          $env:TMP = $performanceTemp
          node scripts/runPerformanceSuite.mjs "--suite=workspace-foundation" "--profile=${{ needs.change-scope.outputs.full_validation == 'true' && 'full' || 'extended' }}" "--prepared-binaries=.performance-artifacts/binaries" "--build-identity=${{ needs.performance-prepare.outputs.binary_build_identity }}"

  performance-profile:
    name: Performance profile
    needs: [change-scope, performance-prepare, performance-search, performance-scan-schema, performance-library-content, performance-intelligence, performance-workspace-foundation]
    if: ${{ always() && needs.change-scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify expected performance shard results
        env:
          CLASSIFIER: ${{ needs.change-scope.result }}
          PREPARE: ${{ needs.performance-prepare.result }}
          EXPECTED_ANY: ${{ needs.change-scope.outputs.performance_any }}
          EXPECTED_SEARCH: ${{ needs.change-scope.outputs.perf_search }}
          EXPECTED_SCAN_SCHEMA: ${{ needs.change-scope.outputs.perf_scan_schema }}
          EXPECTED_LIBRARY_CONTENT: ${{ needs.change-scope.outputs.perf_library_content }}
          EXPECTED_INTELLIGENCE: ${{ needs.change-scope.outputs.perf_intelligence }}
          EXPECTED_WORKSPACE_FOUNDATION: ${{ needs.change-scope.outputs.perf_workspace_foundation }}
          ACTUAL_SEARCH: ${{ needs.performance-search.result }}
          ACTUAL_SCAN_SCHEMA: ${{ needs.performance-scan-schema.result }}
          ACTUAL_LIBRARY_CONTENT: ${{ needs.performance-library-content.result }}
          ACTUAL_INTELLIGENCE: ${{ needs.performance-intelligence.result }}
          ACTUAL_WORKSPACE_FOUNDATION: ${{ needs.performance-workspace-foundation.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFIER" = success
          if [ "$EXPECTED_ANY" = true ]; then
            test "$PREPARE" = success
          fi
          check_shard() {
            expected="$1"
            actual="$2"
            label="$3"
            if [ "$expected" = true ]; then
              test "$actual" = success || { echo "$label expected success, got $actual"; exit 1; }
            else
              test "$actual" = skipped || { echo "$label expected skipped, got $actual"; exit 1; }
            fi
          }
          check_shard "$EXPECTED_SEARCH" "$ACTUAL_SEARCH" search
          check_shard "$EXPECTED_SCAN_SCHEMA" "$ACTUAL_SCAN_SCHEMA" scan-schema
          check_shard "$EXPECTED_LIBRARY_CONTENT" "$ACTUAL_LIBRARY_CONTENT" library-content
          check_shard "$EXPECTED_INTELLIGENCE" "$ACTUAL_INTELLIGENCE" intelligence
          check_shard "$EXPECTED_WORKSPACE_FOUNDATION" "$ACTUAL_WORKSPACE_FOUNDATION" workspace-foundation
          {
            echo "## Performance profile"
            echo "- Search: $ACTUAL_SEARCH (expected=$EXPECTED_SEARCH)"
            echo "- Scan/Schema: $ACTUAL_SCAN_SCHEMA (expected=$EXPECTED_SCAN_SCHEMA)"
            echo "- Library/Content: $ACTUAL_LIBRARY_CONTENT (expected=$EXPECTED_LIBRARY_CONTENT)"
            echo "- Intelligence: $ACTUAL_INTELLIGENCE (expected=$EXPECTED_INTELLIGENCE)"
            echo "- Workspace Foundation: $ACTUAL_WORKSPACE_FOUNDATION (expected=$EXPECTED_WORKSPACE_FOUNDATION)"
          } >> "$GITHUB_STEP_SUMMARY"

  performance-macos:
    name: Native macOS performance (arm64)
    needs: change-scope
    if: ${{ needs.change-scope.outputs.docs_only != 'true' && (needs.change-scope.outputs.full_validation == 'true' || needs.change-scope.outputs.performance_sensitive == 'true') }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = "aarch64-apple-darwin"
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
      - name: Setup Node for the shared performance framework
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: zen-canvas-macOS-native-performance
          cache-on-failure: true
      - name: Run native macOS corpus and bookkeeping profiles
        shell: bash
        env:
          FULL_VALIDATION: ${{ needs.change-scope.outputs.full_validation }}
        run: |
          if [ "$FULL_VALIDATION" = true ]; then
            export ZC_MACOS_NATIVE_FULL_PROFILE=1
          fi
          cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime --lib native_classifier_real_mixed_filesystem_corpus_is_atomic -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime --lib macos_native_bookkeeping_benchmark_is_bounded_by_unique_identity -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime --test macos_file_provider_feasibility -- --nocapture
      - name: Prepare native Workspace Foundation performance binary
        shell: bash
        run: |
          export CARGO_TARGET_DIR="$PWD/.performance-cache/target"
          node scripts/preparePerformanceBinaries.mjs \
            --suites=workspace-foundation \
            --profile="${{ needs.change-scope.outputs.full_validation == 'true' && 'full' || 'extended' }}" \
            --cache-root=.performance-cache/binaries \
            --output=.performance-artifacts/binaries
      - name: Run File Workspace Foundation through the shared performance framework
        shell: bash
        run: |
          export PERFORMANCE_TEMP="$PWD/.performance-temp"
          mkdir -p "$PERFORMANCE_TEMP"
          export TEMP="$PERFORMANCE_TEMP"
          export TMP="$PERFORMANCE_TEMP"
          export CARGO_TARGET_DIR="$PWD/.performance-cache/target"
          node scripts/runPerformanceSuite.mjs \
            --suite=workspace-foundation \
            --profile="${{ needs.change-scope.outputs.full_validation == 'true' && 'full' || 'extended' }}" \
            --prepared-binaries=.performance-artifacts/binaries/workspace-foundation

  build-windows:
    name: Release compile (windows-latest)
    needs: change-scope
    if: ${{ needs.change-scope.outputs.release_sensitive == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: zen-canvas-Windows-build-v2
          cache-workspace-crates: true
          cache-targets: true
          cache-on-failure: true
      - name: Release compile without frontend rebuild
        run: npm run check:rust:release

  build-macos:
    name: Release compile (macos-latest)
    needs: change-scope
    if: ${{ needs.change-scope.outputs.release_sensitive == 'true' }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          sw_vers
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = "aarch64-apple-darwin"
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: zen-canvas-macOS-build-v2
          cache-workspace-crates: true
          cache-targets: true
          cache-on-failure: true
      - name: Release compile without frontend rebuild
        run: npm run check:rust:release

  package-windows:
    name: Package NSIS
    needs: change-scope
    if: ${{ needs.change-scope.outputs.full_validation == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: zen-canvas-Windows-package-v2
          cache-workspace-crates: true
          cache-targets: true
          cache-on-failure: true
      - name: Build NSIS package
        run: npm run build

  package-macos:
    name: Package unsigned DMG
    needs: change-scope
    if: ${{ needs.change-scope.outputs.full_validation == 'true' }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          sw_vers
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = "aarch64-apple-darwin"
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: zen-canvas-macOS-package-v2
          cache-workspace-crates: true
          cache-targets: true
          cache-on-failure: true
      - name: Build unsigned DMG
        run: npm run build -- --no-sign

  package-smoke:
    name: Package metadata smoke
    needs: change-scope
    if: ${{ needs.change-scope.outputs.package_sensitive == 'true' && needs.change-scope.outputs.full_validation != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate package metadata and bundle inputs
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lockfile = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const tauri = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
          const rootLock = lockfile.packages?.[""];
          if (!rootLock || rootLock.name !== packageJson.name || rootLock.version !== packageJson.version) {
            throw new Error("package.json and package-lock.json root metadata must match");
          }
          const targets = tauri.bundle?.targets ?? [];
          for (const target of ["nsis", "dmg"]) {
            if (!targets.includes(target)) throw new Error(`bundle target ${target} is missing`);
          }
          for (const icon of tauri.bundle?.icon ?? []) {
            if (!fs.existsSync(path.resolve("src-tauri", icon))) throw new Error(`bundle icon is missing: ${icon}`);
          }
          console.log(`package smoke passed for ${packageJson.name}@${packageJson.version}`);
          NODE

  dependency-audit:
    name: Dependency audit
    needs: change-scope
    if: ${{ needs.change-scope.outputs.dependency_sensitive == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: npm audit
        run: npm run security:audit
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: RustSec audit
        run: npm run security:audit:rust

  quality-windows:
    name: Quality (windows-latest)
    needs: [change-scope, frontend-quality, rust-windows, performance-profile, build-windows, package-windows, package-smoke, dependency-audit]
    if: ${{ always() && needs.change-scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify Windows gate dependencies
        env:
          CLASSIFIER: ${{ needs.change-scope.result }}
          FRONTEND_EXPECTED: ${{ needs.change-scope.outputs.frontend_changed }}
          RUST_EXPECTED: ${{ needs.change-scope.outputs.rust_changed }}
          BUILD_EXPECTED: ${{ needs.change-scope.outputs.release_sensitive }}
          PACKAGE_EXPECTED: ${{ needs.change-scope.outputs.full_validation }}
          PACKAGE_SMOKE_EXPECTED: ${{ needs.change-scope.outputs.package_sensitive == 'true' && needs.change-scope.outputs.full_validation != 'true' }}
          AUDIT_EXPECTED: ${{ needs.change-scope.outputs.dependency_sensitive }}
          FRONTEND: ${{ needs.frontend-quality.result }}
          RUST: ${{ needs.rust-windows.result }}
          PERFORMANCE: ${{ needs.performance-profile.result }}
          BUILD: ${{ needs.build-windows.result }}
          PACKAGE: ${{ needs.package-windows.result }}
          PACKAGE_SMOKE: ${{ needs.package-smoke.result }}
          AUDIT: ${{ needs.dependency-audit.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFIER" = success
          check_expected() {
            expected="$1"
            actual="$2"
            label="$3"
            if [ "$expected" = true ]; then
              test "$actual" = success || { echo "$label expected success, got $actual"; exit 1; }
            else
              test "$actual" = skipped || { echo "$label expected skipped, got $actual"; exit 1; }
            fi
          }
          check_expected "$FRONTEND_EXPECTED" "$FRONTEND" frontend
          check_expected "$RUST_EXPECTED" "$RUST" rust-windows
          check_expected true "$PERFORMANCE" performance-profile
          check_expected "$BUILD_EXPECTED" "$BUILD" release-compile-windows
          check_expected "$PACKAGE_EXPECTED" "$PACKAGE" package-windows
          check_expected "$PACKAGE_SMOKE_EXPECTED" "$PACKAGE_SMOKE" package-smoke
          check_expected "$AUDIT_EXPECTED" "$AUDIT" dependency-audit

  quality-macos:
    name: Quality (macos-latest)
    needs: [change-scope, frontend-quality, rust-macos, performance-profile, performance-macos, build-macos, package-macos, package-smoke, dependency-audit]
    if: ${{ always() && needs.change-scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify macOS gate dependencies
        env:
          CLASSIFIER: ${{ needs.change-scope.result }}
          FRONTEND_EXPECTED: ${{ needs.change-scope.outputs.frontend_changed }}
          MACOS_EXPECTED: ${{ needs.change-scope.outputs.macos_sensitive }}
          PERFORMANCE_SENSITIVE: ${{ needs.change-scope.outputs.performance_sensitive }}
          BUILD_EXPECTED: ${{ needs.change-scope.outputs.release_sensitive }}
          PACKAGE_EXPECTED: ${{ needs.change-scope.outputs.full_validation }}
          PACKAGE_SMOKE_EXPECTED: ${{ needs.change-scope.outputs.package_sensitive == 'true' && needs.change-scope.outputs.full_validation != 'true' }}
          AUDIT_EXPECTED: ${{ needs.change-scope.outputs.dependency_sensitive }}
          FRONTEND: ${{ needs.frontend-quality.result }}
          MACOS: ${{ needs.rust-macos.result }}
          PERFORMANCE: ${{ needs.performance-profile.result }}
          BUILD: ${{ needs.build-macos.result }}
          MACOS_PERFORMANCE: ${{ needs.performance-macos.result }}
          PACKAGE: ${{ needs.package-macos.result }}
          PACKAGE_SMOKE: ${{ needs.package-smoke.result }}
          AUDIT: ${{ needs.dependency-audit.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFIER" = success
          check_expected() {
            expected="$1"
            actual="$2"
            label="$3"
            if [ "$expected" = true ]; then
              test "$actual" = success || { echo "$label expected success, got $actual"; exit 1; }
            else
              test "$actual" = skipped || { echo "$label expected skipped, got $actual"; exit 1; }
            fi
          }
          check_expected "$FRONTEND_EXPECTED" "$FRONTEND" frontend
          check_expected "$MACOS_EXPECTED" "$MACOS" rust-macos
          check_expected "$PERFORMANCE_SENSITIVE" "$MACOS_PERFORMANCE" native-macos-performance
          check_expected true "$PERFORMANCE" performance-profile
          check_expected "$BUILD_EXPECTED" "$BUILD" release-compile-macos
          check_expected "$PACKAGE_EXPECTED" "$PACKAGE" package-macos
          check_expected "$PACKAGE_SMOKE_EXPECTED" "$PACKAGE_SMOKE" package-smoke
          check_expected "$AUDIT_EXPECTED" "$AUDIT" dependency-audit
