name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  change-scope:
    name: Change scope / documentation contract
    runs-on: windows-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      diff_base: ${{ steps.classify.outputs.diff_base }}
      diff_head: ${{ steps.classify.outputs.diff_head }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: pwsh
        run: |
          $head = "${{ github.sha }}"
          if ("${{ github.event_name }}" -eq "pull_request") {
            $base = "${{ github.event.pull_request.base.sha }}"
            $head = "${{ github.event.pull_request.head.sha }}"
          } else {
            $base = "${{ github.event.before }}"
          }

          if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') {
            $base = (git rev-list --max-parents=0 $head | Select-Object -First 1)
          }

          $files = @(git diff --name-only --diff-filter=ACMR $base $head)
          $docsOnly = $files.Count -gt 0

          foreach ($file in $files) {
            $isDocumentation =
              $file -like 'docs/*' -or
              $file -match '(?i)(^|/)[^/]+\.mdx?$' -or
              $file -match '(?i)^LICENSE(?:\..*)?$' -or
              $file -like '.github/ISSUE_TEMPLATE/*' -or
              $file -like '.github/PULL_REQUEST_TEMPLATE*'

            if (-not $isDocumentation) {
              $docsOnly = $false
              break
            }
          }

          $docsOnlyValue = $docsOnly.ToString().ToLowerInvariant()
          "docs_only=$docsOnlyValue" >> $env:GITHUB_OUTPUT
          "diff_base=$base" >> $env:GITHUB_OUTPUT
          "diff_head=$head" >> $env:GITHUB_OUTPUT

          "## Change scope" >> $env:GITHUB_STEP_SUMMARY
          "- documentation-only: $docsOnlyValue" >> $env:GITHUB_STEP_SUMMARY
          "- diff base: $base" >> $env:GITHUB_STEP_SUMMARY
          "- diff head: $head" >> $env:GITHUB_STEP_SUMMARY
          "- changed files: $($files.Count)" >> $env:GITHUB_STEP_SUMMARY
          foreach ($file in $files) {
            "  - $file" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Setup Node for documentation validation
        if: steps.classify.outputs.docs_only == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Validate documentation-only change
        if: steps.classify.outputs.docs_only == 'true'
        shell: pwsh
        env:
          DOCS_DIFF_BASE: ${{ steps.classify.outputs.diff_base }}
          DOCS_DIFF_HEAD: ${{ steps.classify.outputs.diff_head }}
        run: |
          npm run test:docs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check $env:DOCS_DIFF_BASE $env:DOCS_DIFF_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  quality:
    name: Quality (${{ matrix.os }})
    needs: change-scope
    if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Rust and Cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            src-tauri -> target
          shared-key: zen-canvas-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'rust-toolchain', 'rust-toolchain.toml') }}
          cache-targets: true
          cache-all-crates: true
          cache-on-failure: true
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            ~/.rustup/update

      - name: Install dependencies
        run: npm ci

      - name: Frontend typecheck and tests
        run: |
          npm run typecheck
          npm test

      - name: Remediation contract guard
        run: npm run test:remediation

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      # Environmental-failure protocol (docs/remediation/issue-file-ops-flaky.md, F2):
      # a failed run is reran ONCE only when every failed test belongs to the
      # file_ops group AND the log carries the documented environmental signature
      # (Windows sharing violation / post-commit identity mismatch). Such runs are
      # counted as "inconclusive" and the count lands in the step summary and an
      # artifact, so the trigger frequency stays observable. Any other failure —
      # or a failed rerun — fails the job with no further retries.
      - name: Rust tests
        id: rust-tests
        shell: bash
        env:
          ZEN_CANVAS_ENV_RETRY_LOG: ${{ github.workspace }}/env-retry-${{ runner.os }}.log
        run: |
          set +e
          run_tests() {
            cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime 2>&1 | tee "$1"
            return "${PIPESTATUS[0]}"
          }
          run_tests "rust-test-${{ runner.os }}.log"
          status=$?
          inconclusive=0
          if [ "$status" != "0" ]; then
            failed_tests=$(grep -E '^test [^ ]+ \.\.\. FAILED' "rust-test-${{ runner.os }}.log" | awk '{print $2}' | sort -u)
            non_file_ops=$(printf '%s\n' "$failed_tests" | grep -v '^file_ops::tests::' | grep -c . || true)
            has_signature=0
            if grep -qE 'os error 32|target_committed_identity_mismatch|\[env-retry\]' "rust-test-${{ runner.os }}.log"; then
              has_signature=1
            fi
            if [ -n "$failed_tests" ] && [ "$non_file_ops" = "0" ] && [ "$has_signature" = "1" ]; then
              inconclusive=1
              echo "::warning::file_ops environmental failure signature detected; run classified inconclusive, rerunning once (docs/remediation/issue-file-ops-flaky.md)"
              run_tests "rust-test-${{ runner.os }}-rerun.log"
              status=$?
            fi
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "inconclusive=$inconclusive" >> "$GITHUB_OUTPUT"
          {
            echo "## Rust tests (${{ runner.os }})"
            echo "- final status: $status"
            echo "- inconclusive (environmental) CI reruns in this job: $inconclusive"
            if [ -s "$ZEN_CANVAS_ENV_RETRY_LOG" ]; then
              echo "- in-test environmental retries (F1):"
              echo '```'
              cat "$ZEN_CANVAS_ENV_RETRY_LOG"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$inconclusive" = "1" ] || [ -s "$ZEN_CANVAS_ENV_RETRY_LOG" ]; then
            {
              echo "inconclusive_ci_reruns=$inconclusive"
              echo "runner_os=${{ runner.os }}"
              echo "sha=${{ github.sha }}"
              if [ -s "$ZEN_CANVAS_ENV_RETRY_LOG" ]; then
                echo "--- in-test environmental retries ---"
                cat "$ZEN_CANVAS_ENV_RETRY_LOG"
              fi
            } > "flaky-inconclusive-${{ runner.os }}.txt"
          fi
          exit 0

      - name: Upload environmental-failure record
        if: steps.rust-tests.outputs.inconclusive == '1' || hashFiles('flaky-inconclusive-*.txt') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flaky-inconclusive-${{ runner.os }}-${{ github.sha }}
          path: flaky-inconclusive-${{ runner.os }}.txt
          if-no-files-found: ignore

      - name: Upload Rust test log
        if: steps.rust-tests.outputs.status != '0' || steps.rust-tests.outputs.inconclusive == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-test-${{ runner.os }}-${{ github.sha }}
          path: |
            rust-test-${{ runner.os }}.log
            rust-test-${{ runner.os }}-rerun.log
          if-no-files-found: ignore

      - name: Preserve Rust test result
        if: steps.rust-tests.outputs.status != '0'
        shell: bash
        run: exit 1

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --features desktop-runtime --all-targets -- -D warnings

      - name: macOS path and temp policy regression
        if: runner.os == 'macOS'
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime macos_
          cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime temp_safety_tests

      - name: 100k search performance test
        if: runner.os == 'Windows'
        run: npm run test:performance

      - name: Native filesystem hardening smoke
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --features "desktop-runtime native-qa" --test native_file_hardening_smoke -- --ignored --nocapture --test-threads=1

      - name: Windows production build and NSIS package
        if: runner.os == 'Windows'
        run: npm run build

      - name: macOS production build and unsigned DMG package
        if: runner.os == 'macOS'
        run: npm run build -- --no-sign

  dependency-audit:
    name: Dependency audit
    needs: change-scope
    if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm run security:audit

      - name: RustSec audit
        run: |
          cargo install cargo-audit --locked
          npm run security:audit:rust
