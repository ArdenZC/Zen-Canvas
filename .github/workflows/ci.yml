name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Rust and Cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            src-tauri -> target
          shared-key: zen-canvas-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'rust-toolchain', 'rust-toolchain.toml') }}
          cache-targets: true
          cache-all-crates: true
          cache-on-failure: true
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            ~/.rustup/update

      - name: Install dependencies
        run: npm ci

      - name: Frontend typecheck and tests
        run: |
          npm run typecheck
          npm test

      - name: Remediation contract guard
        run: npm run test:remediation

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust tests
        id: rust-tests
        shell: bash
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime 2>&1 | tee rust-test-${{ runner.os }}.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Rust test log
        if: steps.rust-tests.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-test-${{ runner.os }}-${{ github.sha }}
          path: rust-test-${{ runner.os }}.log

      - name: Preserve Rust test result
        if: steps.rust-tests.outputs.status != '0'
        shell: bash
        run: exit 1

      - name: Rust clippy
        id: rust-clippy
        shell: bash
        run: |
          set +e
          cargo clippy --manifest-path src-tauri/Cargo.toml --features desktop-runtime --all-targets -- -D warnings 2>&1 | tee rust-clippy-${{ runner.os }}.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Rust clippy log
        if: steps.rust-clippy.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-clippy-${{ runner.os }}-${{ github.sha }}
          path: rust-clippy-${{ runner.os }}.log

      - name: Preserve Rust clippy result
        if: steps.rust-clippy.outputs.status != '0'
        shell: bash
        run: exit 1

      - name: macOS path and temp policy regression
        if: runner.os == 'macOS'
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime macos_
          cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime temp_safety_tests

      - name: 100k search performance test
        if: runner.os == 'Windows'
        run: npm run test:performance

      - name: Native filesystem hardening smoke
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --features "desktop-runtime native-qa" --test native_file_hardening_smoke -- --ignored --nocapture --test-threads=1

      - name: Windows production build and NSIS package
        if: runner.os == 'Windows'
        run: npm run build

      - name: macOS production build and unsigned DMG package
        if: runner.os == 'macOS'
        run: npm run build -- --no-sign

  dependency-audit:
    name: Dependency audit
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm run security:audit

      - name: RustSec audit
        run: |
          cargo install cargo-audit --locked
          npm run security:audit:rust

  one-shot-windows-compile-fix:
    name: Repair Windows native compilation
    if: github.head_ref == 'agent/system-wide-search-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/system-wide-search-hardening

      - name: Apply compile repairs
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          service = Path('src-tauri/src/global_index/windows/service.rs')
          text = service.read_text(encoding='utf-8')
          old = 'CreateFileW, FlushFileBuffers, ReadFile, WriteFile, OPEN_EXISTING,'
          new = 'CreateFileW, FlushFileBuffers, ReadFile, WriteFile, OPEN_EXISTING, PIPE_ACCESS_DUPLEX,'
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected FileSystem import count: {text.count(old)}')
              text = text.replace(old, new)
          text = text.replace(
              'WaitNamedPipeW, PIPE_ACCESS_DUPLEX, PIPE_READMODE_MESSAGE, PIPE_REJECT_REMOTE_CLIENTS,',
              'WaitNamedPipeW, PIPE_READMODE_MESSAGE, PIPE_REJECT_REMOTE_CLIENTS,',
              1,
          )
          service.write_text(text, encoding='utf-8')

          mft = Path('src-tauri/src/global_index/windows/mft.rs')
          text = mft.read_text(encoding='utf-8')
          old = '''    statement
        .query_map(
            params![i64::from(FILE_ATTRIBUTE_DIRECTORY)],
            staged_record_from_row,
        )
        .map_err(|error| {
            GlobalIndexError::Provider(format!("mft_staging_directory_query_failed: {error}"))
        })?
        .collect::<Result<Vec<_>, _>>()
        .map_err(|error| {
            GlobalIndexError::Provider(format!("mft_staging_directory_decode_failed: {error}"))
        })
'''
          new = '''    let rows = statement
        .query_map(
            params![i64::from(FILE_ATTRIBUTE_DIRECTORY)],
            staged_record_from_row,
        )
        .map_err(|error| {
            GlobalIndexError::Provider(format!("mft_staging_directory_query_failed: {error}"))
        })?;
    let directories = rows.collect::<Result<Vec<_>, _>>().map_err(|error| {
        GlobalIndexError::Provider(format!("mft_staging_directory_decode_failed: {error}"))
    })?;
    Ok(directories)
'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected directory query block count: {text.count(old)}')
              text = text.replace(old, new)

          old = '''            statement
                .query_map(params![last_sequence, STAGING_READ_BATCH], |row| {
                    Ok((
                        row.get::<_, i64>(0)?,
                        staged_record_from_row_offset(row, 1)?,
                    ))
                })
                .map_err(|error| {
                    GlobalIndexError::Provider(format!("mft_staging_read_failed: {error}"))
                })?
                .collect::<Result<Vec<_>, _>>()
                .map_err(|error| {
                    GlobalIndexError::Provider(format!("mft_staging_decode_failed: {error}"))
                })?
'''
          new = '''            let mapped = statement
                .query_map(params![last_sequence, STAGING_READ_BATCH], |row| {
                    Ok((
                        row.get::<_, i64>(0)?,
                        staged_record_from_row_offset(row, 1)?,
                    ))
                })
                .map_err(|error| {
                    GlobalIndexError::Provider(format!("mft_staging_read_failed: {error}"))
                })?;
            mapped.collect::<Result<Vec<_>, _>>().map_err(|error| {
                GlobalIndexError::Provider(format!("mft_staging_decode_failed: {error}"))
            })?
'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected staged read block count: {text.count(old)}')
              text = text.replace(old, new)
          mft.write_text(text, encoding='utf-8')
          PY

          cargo fmt --manifest-path src-tauri/Cargo.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/global_index/windows
          git diff --cached --check
          git commit -m "fix(windows): repair native index compilation"
          git push origin HEAD:agent/system-wide-search-hardening
