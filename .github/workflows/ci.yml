name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Rust and Cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            src-tauri -> target
          shared-key: zen-canvas-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'rust-toolchain', 'rust-toolchain.toml') }}
          cache-targets: true
          cache-all-crates: true
          cache-on-failure: true
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            ~/.rustup/update

      - name: Install dependencies
        run: npm ci

      - name: Frontend typecheck and tests
        run: |
          npm run typecheck
          npm test

      - name: Remediation contract guard
        run: npm run test:remediation

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust tests
        id: rust-tests
        shell: bash
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime 2>&1 | tee rust-test-${{ runner.os }}.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Rust test log
        if: steps.rust-tests.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-test-${{ runner.os }}-${{ github.sha }}
          path: rust-test-${{ runner.os }}.log

      - name: Preserve Rust test result
        if: steps.rust-tests.outputs.status != '0'
        shell: bash
        run: exit 1

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --features desktop-runtime --all-targets -- -D warnings

      - name: macOS path and temp policy regression
        if: runner.os == 'macOS'
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime macos_
          cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime temp_safety_tests

      - name: 100k search performance test
        if: runner.os == 'Windows'
        run: npm run test:performance

      - name: Native filesystem hardening smoke
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --features "desktop-runtime native-qa" --test native_file_hardening_smoke -- --ignored --nocapture --test-threads=1

      - name: Windows production build and NSIS package
        if: runner.os == 'Windows'
        run: npm run build

      - name: macOS production build and unsigned DMG package
        if: runner.os == 'macOS'
        run: npm run build -- --no-sign

  dependency-audit:
    name: Dependency audit
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm run security:audit

      - name: RustSec audit
        run: |
          cargo install cargo-audit --locked
          npm run security:audit:rust

  one-shot-schema-assertion-fix:
    name: Update current schema assertions
    if: github.head_ref == 'agent/system-wide-search-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/system-wide-search-hardening

      - name: Update current-version assertions only
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          paths = [
              Path('src-tauri/tests/dedupe.rs'),
              Path('src-tauri/tests/settings.rs'),
              Path('src-tauri/tests/storage_analyzer.rs'),
              Path('src-tauri/tests/migrations.rs'),
          ]
          total = 0
          for path in paths:
              text = path.read_text(encoding='utf-8')
              text, count_a = re.subn(
                  r'assert_eq!\((version|migrated_version),\s*25\);',
                  lambda match: f'assert_eq!({match.group(1)}, 26);',
                  text,
              )
              text, count_b = re.subn(
                  r'(\.expect\("read schema version"\),\s*)25(\s*\);)',
                  r'\g<1>26\g<2>',
                  text,
              )
              total += count_a + count_b
              path.write_text(text, encoding='utf-8')

          if total != 7:
              raise SystemExit(f'expected 7 stale current-schema assertions, updated {total}')

          suspicious = []
          for path in Path('src-tauri').rglob('*.rs'):
              lines = path.read_text(encoding='utf-8').splitlines()
              for index, line in enumerate(lines):
                  if 'assert_eq!' in line and ', 25' in line:
                      suspicious.append(f'{path}:{index + 1}:{line.strip()}')
                  if 'expect("read schema version")' in line:
                      following = '\n'.join(lines[index + 1:index + 4])
                      if re.search(r'^\s*25\s*$', following, re.MULTILINE):
                          suspicious.append(f'{path}:{index + 1}:multiline current schema 25')
          if suspicious:
              raise SystemExit('remaining suspicious schema assertions:\n' + '\n'.join(suspicious))
          PY

          cargo fmt --manifest-path src-tauri/Cargo.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tests
          git diff --cached --check
          git commit -m "test(migration): align current schema assertions"
          git push origin HEAD:agent/system-wide-search-hardening
