name: W3-11 stale pointer helper

on:
  push:
    branches:
      - docs/w3-11-preview-platform-closeout

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[w3-11-stale-helper]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: docs/w3-11-preview-platform-closeout
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/project/ROADMAP.md')
          text = p.read_text(encoding='utf-8')
          old = 'W3 ACTIVE\n ↓\nW3-00 ✅'
          new = 'W3 ✅ COMPLETE\n ↓\nW3-00 ✅'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale W3 ACTIVE pointer, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git diff --check
          npm run test:governance
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/ROADMAP.md
          git commit -m "docs: remove stale W3 active pointer [w3-11-stale-helper]"
          git push origin HEAD:docs/w3-11-preview-platform-closeout
