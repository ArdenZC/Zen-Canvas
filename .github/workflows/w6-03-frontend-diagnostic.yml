name: W6-03 Frontend Diagnostic

on:
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: w6-03-frontend-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp-tests/playwright-browsers

jobs:
  frontend-diagnostic:
    name: W6-03 mirrored frontend quality diagnostics
    if: ${{ github.head_ref == 'feat/w6-03-product-hierarchy-progressive-disclosure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout merge-integration lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright Chromium
        id: playwright-browser-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .tmp-tests/playwright-browsers
          key: zen-canvas-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium system dependencies
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=2
          per_attempt_timeout=7m
          backoff_seconds=10

          cleanup_apt_processes() {
            local pids
            if pids="$(pgrep -x apt-get)"; then
              echo "[playwright-deps] terminating orphaned apt-get pids=${pids}"
              for pid in $pids; do
                sudo -n kill -TERM "$pid" || true
              done
              sleep 2
              if pids="$(pgrep -x apt-get)"; then
                for pid in $pids; do
                  sudo -n kill -KILL "$pid" || true
                done
                sleep 2
              fi
            fi
          }

          for attempt in $(seq 1 "$max_attempts"); do
            echo "[playwright-deps] attempt=${attempt}/${max_attempts} timeout=${per_attempt_timeout}"
            if timeout --signal=TERM --kill-after=30s "$per_attempt_timeout" npx playwright install-deps chromium; then
              status=0
            else
              status=$?
            fi
            if [ "$status" -eq 0 ]; then
              echo "[playwright-deps] PASS attempt=${attempt}"
              exit 0
            fi
            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              cleanup_apt_processes
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              exit "$status"
            fi
            sleep "$backoff_seconds"
          done
      - name: Install Chromium browser
        if: steps.playwright-browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Record pre-test runner state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-diagnostic
          {
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "--- memory ---"
            free -h
            echo "--- disk ---"
            df -h .
            echo "--- apt-get ---"
            pgrep -a apt-get || true
          } | tee .ci-diagnostic/runner-state.log
      - name: Typecheck diagnostic
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run typecheck 2>&1 | tee .ci-diagnostic/typecheck.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" | tee .ci-diagnostic/typecheck.status
          exit 0
      - name: Vitest diagnostic
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm test 2>&1 | tee .ci-diagnostic/vitest.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" | tee .ci-diagnostic/vitest.status
          exit 0
      - name: Remediation diagnostic
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run test:remediation 2>&1 | tee .ci-diagnostic/remediation.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" | tee .ci-diagnostic/remediation.status
          exit 0
      - name: Performance architecture diagnostic
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run test:performance:architecture 2>&1 | tee .ci-diagnostic/architecture.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" | tee .ci-diagnostic/architecture.status
          exit 0
      - name: Summarize frontend diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          for name in typecheck vitest remediation architecture; do
            if [ -f ".ci-diagnostic/${name}.status" ]; then
              echo "${name}=$(cat ".ci-diagnostic/${name}.status")"
            else
              echo "${name}=missing"
            fi
          done
      - name: Upload frontend diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: w6-03-frontend-diagnostic-evidence
          path: .ci-diagnostic
          include-hidden-files: true
          if-no-files-found: error
      - name: Require all mirrored frontend quality commands
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for name in typecheck vitest remediation architecture; do
            status_file=".ci-diagnostic/${name}.status"
            if [ ! -f "$status_file" ]; then
              echo "[diagnostic] ${name}=missing"
              failed=1
              continue
            fi
            status="$(cat "$status_file")"
            echo "[diagnostic] ${name}=${status}"
            if [ "$status" != "0" ]; then
              failed=1
            fi
          done
          exit "$failed"
