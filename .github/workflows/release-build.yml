name: Build Release Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows NSIS
            os: windows-latest
          - name: macOS DMG
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          sw_vers
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = "aarch64-apple-darwin"
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"

      - name: Verify checkout provenance and version metadata
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_REF: ${{ github.ref }}
          EXPECTED_TAG: ${{ github.ref_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if [[ "$EXPECTED_REF" == refs/tags/* ]]; then
            test "$(git rev-list -n 1 "$EXPECTED_TAG")" = "$EXPECTED_SHA"
          fi
          node <<'NODE'
          const fs = require("node:fs");

          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const packageLock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const tauriConfig = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
          const cargoToml = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
          const cargoLock = fs.readFileSync("src-tauri/Cargo.lock", "utf8");
          const cargoVersion = cargoToml.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const cargoLockVersion = cargoLock.match(/\[\[package\]\]\s*name\s*=\s*"zen-canvas-tauri"\s*version\s*=\s*"([^"]+)"/s)?.[1];
          const versions = [
            packageJson.version,
            packageLock.version,
            packageLock.packages?.[""].version,
            tauriConfig.version,
            cargoVersion,
            cargoLockVersion,
          ];
          if (versions.some((version) => !version) || new Set(versions).size !== 1) {
            console.error("Release version metadata mismatch", versions);
            process.exit(1);
          }
          if (process.env.EXPECTED_REF.startsWith("refs/tags/")) {
            const tagVersion = process.env.EXPECTED_TAG.replace(/^v/, "");
            if (tagVersion !== versions[0]) {
              console.error(`Release tag ${process.env.EXPECTED_TAG} does not match version ${versions[0]}`);
              process.exit(1);
            }
          }
          NODE

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust test
        run: cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --features desktop-runtime -- -D warnings

      - name: Rust dependency audit
        shell: bash
        run: |
          cargo install cargo-audit --locked
          npm run security:audit:rust

      - name: 100k search performance test
        run: npm run test:performance

      - name: Security audit
        run: npm run security:audit

      - name: Package Windows installer
        if: runner.os == 'Windows'
        run: npm run build

      - name: Verify Windows NSIS artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installers = @(Get-ChildItem -LiteralPath "src-tauri/target/release/bundle/nsis" -Filter *.exe -File -ErrorAction Stop)
          if ($installers.Count -eq 0) { throw "No Windows NSIS installer was produced." }
          foreach ($installer in $installers) {
            if ($installer.Length -le 0) { throw "Windows installer is empty: $($installer.FullName)" }
            if ($installer.Name -notlike "*$version*") { throw "Windows installer version mismatch: $($installer.Name)" }
          }

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: npm run build -- --no-sign

      - name: Verify unsigned macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#dmgs[@]}" -gt 0
          for dmg in "${dmgs[@]}"; do
            test -s "$dmg"
            name="$(basename "$dmg")"
            [[ "$name" == *"$version"* ]]
            [[ "$name" != *"x86_64"* ]]
            [[ "$name" != *"universal"* ]]
          done

      - name: Generate Node SBOM
        shell: bash
        run: npm sbom --sbom-format cyclonedx > sbom-node.cdx.json

      - name: Generate Rust SBOM
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json --override-filename sbom-rust.cdx

      - name: Verify SBOM outputs
        shell: bash
        run: |
          test -s sbom-node.cdx.json
          test -s src-tauri/sbom-rust.cdx.json
          node <<'NODE'
          const fs = require("node:fs");
          for (const path of ["sbom-node.cdx.json", "src-tauri/sbom-rust.cdx.json"]) {
            const document = JSON.parse(fs.readFileSync(path, "utf8"));
            if (document.bomFormat !== "CycloneDX" || !document.specVersion) {
              throw new Error(`Invalid CycloneDX SBOM: ${path}`);
            }
          }
          NODE

      - name: Generate Windows checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath "src-tauri/target/release/bundle/nsis" -Filter *.exe -File -ErrorAction Stop)
          if ($installers.Count -eq 0) { throw "Cannot generate a Windows checksum manifest without an installer." }
          $lines = foreach ($installer in $installers) {
            "$(Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($installer.Name)"
          }
          $lines | Set-Content installers-windows.sha256

      - name: Generate macOS checksums
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg_files=(src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#dmg_files[@]}" -gt 0
          : > installers-macos.sha256
          for dmg in "${dmg_files[@]}"; do
            hash="$(shasum -a 256 "$dmg" | awk '{ print $1 }')"
            printf '%s  %s\n' "$hash" "$(basename "$dmg")" >> installers-macos.sha256
          done

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Zen-Canvas-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            sbom-node.cdx.json
            src-tauri/sbom-rust.cdx.json
            installers-*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    needs: build
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-artifacts

      - name: Verify final release artifacts and checksums
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_TAG: ${{ github.ref_name }}
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:EXPECTED_SHA) { throw "Release checkout is not bound to the workflow commit." }
          $tagCommit = (git rev-list -n 1 $env:EXPECTED_TAG).Trim()
          if ($tagCommit -ne $env:EXPECTED_SHA) { throw "Release tag is not bound to the workflow commit." }
          $root = (Resolve-Path release-artifacts).Path
          $version = $env:EXPECTED_TAG.Substring(1)
          $installers = @(Get-ChildItem -LiteralPath $root -Recurse -File | Where-Object { $_.Extension -in @('.exe', '.dmg') })
          $windowsInstallers = @($installers | Where-Object Extension -eq '.exe')
          $macInstallers = @($installers | Where-Object Extension -eq '.dmg')
          if ($windowsInstallers.Count -eq 0) { throw "Downloaded release has no Windows NSIS installer." }
          if ($macInstallers.Count -eq 0) { throw "Downloaded release has no macOS DMG installer." }
          foreach ($installer in $installers) {
            if ($installer.Length -le 0) { throw "Downloaded installer is empty: $($installer.FullName)" }
            if ($installer.Name -notlike "*$version*") { throw "Downloaded installer version mismatch: $($installer.Name)" }
          }

          $manifests = @(Get-ChildItem -LiteralPath $root -Recurse -Filter *.sha256 -File)
          if ($manifests.Count -ne 2) { throw "Expected one checksum manifest per platform; found $($manifests.Count)." }
          $covered = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($manifest in $manifests) {
            $lines = @(Get-Content -LiteralPath $manifest.FullName | Where-Object { $_.Trim() })
            if ($lines.Count -eq 0) { throw "Checksum manifest is empty: $($manifest.FullName)" }
            foreach ($line in $lines) {
              if ($line -notmatch '^\s*([0-9a-fA-F]{64})\s+\*?(.+?)\s*$') {
                throw "Malformed checksum entry in $($manifest.Name): $line"
              }
              $expectedHash = $Matches[1].ToUpperInvariant()
              $fileName = $Matches[2].Trim()
              $matches = @(Get-ChildItem -LiteralPath $root -Recurse -File | Where-Object Name -eq $fileName)
              if ($matches.Count -ne 1) { throw "Checksum entry does not identify exactly one uploaded file: $fileName" }
              $actualHash = (Get-FileHash -LiteralPath $matches[0].FullName -Algorithm SHA256).Hash.ToUpperInvariant()
              if ($actualHash -ne $expectedHash) { throw "Checksum mismatch for final uploaded file: $fileName" }
              [void]$covered.Add($matches[0].FullName)
            }
          }
          foreach ($installer in $installers) {
            if (-not $covered.Contains($installer.FullName)) { throw "Installer is not covered by an uploaded checksum manifest: $($installer.Name)" }
          }

          $sboms = @(Get-ChildItem -LiteralPath $root -Recurse -Filter *.cdx.json -File)
          if ($sboms.Count -ne 2) { throw "Expected Node and Rust SBOMs; found $($sboms.Count)." }
          foreach ($sbom in $sboms) {
            if ($sbom.Length -le 0) { throw "SBOM is empty: $($sbom.FullName)" }
            $document = Get-Content -LiteralPath $sbom.FullName -Raw | ConvertFrom-Json
            if ($document.bomFormat -ne "CycloneDX" -or -not $document.specVersion) {
              throw "Invalid CycloneDX SBOM: $($sbom.FullName)"
            }
          }

      - name: Attach installers to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: Zen Canvas ${{ github.ref_name }}
          body: |
            Zen Canvas public build.

            Distribution model: UNSIGNED
            Windows Authenticode: OUT OF SCOPE
            macOS Developer ID: OUT OF SCOPE
            Apple notarization: OUT OF SCOPE
            Stapling: OUT OF SCOPE
            Signing/notarization is not P0/P1/P2 and is not a Release blocker.

            - Windows: Tauri NSIS installer
            - macOS: Tauri DMG installer
            - Branded Zen Canvas installer assets, app icon, and bilingual release/legal copy
            - Local-first SQLite FTS search, preview execution, and configurable 15/30/60/90-day restore records
            - Security posture: Tauri desktop runtime, strict content security policy, guarded move/rename operations, and npm high audit clean
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.dmg
            release-artifacts/**/*.sha256
            release-artifacts/**/*.cdx.json
          fail_on_unmatched_files: true
