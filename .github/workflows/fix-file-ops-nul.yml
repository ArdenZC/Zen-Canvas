name: Fix file-ops source literal

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ci/code-pr-fast-path'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Replace embedded NUL and remove one-shot files
        run: |
          python3 scripts/fixFileOpsNul.py
          cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit corrected source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: normalize cleanup path literal"
          git push origin HEAD:${{ github.head_ref }}
