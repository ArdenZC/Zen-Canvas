name: One-shot Rust repair

on:
  push:
    branches:
      - agent/system-wide-search-hardening

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip rustfmt]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/system-wide-search-hardening
      - name: Apply compile fixes
        run: python scripts/fix_macos_compile.py
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git commit -m "fix(macos): repair native bridge compilation [skip rustfmt]"
          git push origin HEAD:agent/system-wide-search-hardening
