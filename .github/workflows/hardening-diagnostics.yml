name: Hardening Diagnostics

on:
  push:
    branches:
      - agent/system-wide-search-hardening

permissions:
  contents: write
  issues: write

concurrency:
  group: hardening-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/system-wide-search-hardening
      - name: Apply hardening patches and rustfmt
        shell: bash
        run: |
          if grep -q 'CURRENT_SCHEMA_VERSION: i32 = 25' src-tauri/src/db/schema.rs; then
            python scripts/apply_global_index_hardening.py
          fi
          if grep -q 'classify_ai_targets_with_configured_provider' src-tauri/src/ai/classification.rs \
             && grep -q 'pub async fn classify_files_with_ai' src-tauri/src/ai/classification.rs \
             && ! grep -q 'enqueue_legacy_targets_for_managed_ai' src-tauri/src/ai/classification.rs; then
            python scripts/apply_legacy_ai_queue_patch.py
          fi
          cargo fmt --manifest-path src-tauri/Cargo.toml
          if git diff --quiet -- src-tauri; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git commit -m "fix(index): harden batch writes and managed AI queue"
          git push origin HEAD:agent/system-wide-search-hardening

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Post compact audit report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE' > audit-summary.md
          const report = require('./audit.json');
          const vulnerabilities = report.vulnerabilities || {};
          const lines = Object.entries(vulnerabilities).map(([name, item]) =>
            `- \`${name}\`: severity=${item.severity}; direct=${Boolean(item.isDirect)}; range=\`${item.range || ''}\`; fix=${JSON.stringify(item.fixAvailable)}`
          );
          console.log('<!-- hardening-audit-report -->');
          console.log('### Temporary dependency audit report');
          console.log('```json');
          console.log(JSON.stringify(report.metadata?.vulnerabilities || {}, null, 2));
          console.log('```');
          console.log(lines.length ? lines.join('\n') : 'No reported vulnerabilities.');
          NODE
          gh api repos/${{ github.repository }}/issues/14/comments -f body="$(cat audit-summary.md)"
