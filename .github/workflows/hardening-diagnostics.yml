name: One-shot hardening cleanup

on:
  push:
    branches:
      - agent/system-wide-search-hardening

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[cleanup complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/system-wide-search-hardening
      - name: Remove temporary remediation files
        shell: bash
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/hardening-diagnostics.yml \
            .github/workflows/one-shot-rustfmt.yml \
            scripts/apply_final_index_correctness.py \
            scripts/apply_global_index_hardening.py \
            scripts/apply_internal_ai_queue_patch.py \
            scripts/apply_legacy_ai_queue_patch.py \
            scripts/apply_macos_delete_hardening.py \
            scripts/apply_managed_scope_backpressure.py \
            scripts/apply_mft_staging_patch.py \
            scripts/apply_spotlight_management_confirmation.py \
            scripts/apply_spotlight_update_key_fix.py \
            scripts/fix_macos_compile.py \
            scripts/fix_managed_scope_control_flow.py \
            scripts/repair_macos_delete_hardening.py \
            src-tauri/src/global_index/managed_worker.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(index): remove remediation scaffolding [cleanup complete]"
          git push origin HEAD:agent/system-wide-search-hardening
