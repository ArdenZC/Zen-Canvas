name: Hardening Diagnostics

on:
  push:
    branches:
      - agent/system-wide-search-hardening

permissions:
  contents: write
  issues: write

concurrency:
  group: hardening-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/system-wide-search-hardening
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Apply hardening patches, rustfmt, and audit snapshot
        shell: bash
        run: |
          if grep -q 'CURRENT_SCHEMA_VERSION: i32 = 25' src-tauri/src/db/schema.rs; then
            python scripts/apply_global_index_hardening.py
          fi
          if grep -q 'classify_ai_targets_with_configured_provider' src-tauri/src/ai/classification.rs \
             && grep -q 'pub async fn classify_files_with_ai' src-tauri/src/ai/classification.rs \
             && ! grep -q 'enqueue_legacy_targets_for_managed_ai' src-tauri/src/ai/classification.rs; then
            python scripts/apply_legacy_ai_queue_patch.py
          fi
          if grep -A12 -q 'pub async fn classify_files_with_ai_for_db' src-tauri/src/ai/classification.rs \
             && grep -A12 'pub async fn classify_files_with_ai_for_db' src-tauri/src/ai/classification.rs | grep -q 'classify_ai_targets_with_configured_provider'; then
            python scripts/apply_internal_ai_queue_patch.py
          fi
          if grep -q 'pub struct MacosSpotlightProvider' src-tauri/src/global_index/macos/mod.rs \
             && ! grep -q 'known_entries:' src-tauri/src/global_index/macos/mod.rs; then
            python scripts/apply_macos_delete_hardening.py
          fi
          cargo fmt --manifest-path src-tauri/Cargo.toml
          npm ci --ignore-scripts
          mkdir -p .hardening
          npm audit --json > .hardening/npm-audit.json || true
          if git diff --quiet -- src-tauri .hardening; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri .hardening
          git commit -m "fix(index): apply hardening patches and diagnostics"
          git push origin HEAD:agent/system-wide-search-hardening
