name: Apply code PR fast-path optimization

on:
  push:
    branches:
      - ci/code-pr-fast-path

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci: bootstrap code PR fast-path optimization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ci/code-pr-fast-path
          fetch-depth: 0

      - name: Apply reviewed transformations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path.cwd()

          # 1. Reject protected paths before any filesystem metadata/canonicalization.
          file_ops_path = root / "src-tauri/src/file_ops.rs"
          file_ops = file_ops_path.read_text(encoding="utf-8")
          old_validator = '''fn validate_cleanup_trash_source(
              path: &Path,
              app_data_dir: Option<&Path>,
          ) -> Result<PathBuf, String> {
              if path.as_os_str().is_empty()
                  || path.to_string_lossy().contains('\\0')
                  || path.to_string_lossy().contains('*')
                  || path.to_string_lossy().contains('?')
                  || path
                      .components()
                      .any(|component| component == Component::ParentDir)
                  || path.parent().is_none()
                  || path.file_name().is_none()
              {
                  return Err(FileOpError::UnsafePathTraversal.to_string());
              }
              if !path.is_absolute() {
                  return Err(FileOpError::RelativePath.to_string());
              }
              if !path.exists() {
                  return Err(FileOpError::SourceMissing.to_string());
              }
              if fs::symlink_metadata(path)
                  .map(|metadata| metadata.file_type().is_symlink())
                  .unwrap_or(false)
              {
                  return Err(FileOpError::ProtectedPath(normalize_path(path)).to_string());
              }

              let source = path
                  .canonicalize()
                  .map_err(|error| FileOpError::Io(error).to_string())?;
              ensure_cleanup_operation_allowed(&source, app_data_dir)?;
              Ok(source)
          }
          '''
          new_validator = '''fn validate_cleanup_path_syntax(path: &Path) -> Result<(), String> {
              if path.as_os_str().is_empty()
                  || path.to_string_lossy().contains('\\0')
                  || path.to_string_lossy().contains('*')
                  || path.to_string_lossy().contains('?')
                  || path
                      .components()
                      .any(|component| component == Component::ParentDir)
                  || path.parent().is_none()
                  || path.file_name().is_none()
              {
                  return Err(FileOpError::UnsafePathTraversal.to_string());
              }
              if !path.is_absolute() {
                  return Err(FileOpError::RelativePath.to_string());
              }
              Ok(())
          }

          fn validate_cleanup_trash_source(
              path: &Path,
              app_data_dir: Option<&Path>,
          ) -> Result<PathBuf, String> {
              validate_cleanup_path_syntax(path)?;

              // Lexical protection must happen before exists/metadata/canonicalize. Besides
              // avoiding expensive access to real system trees, this closes the policy gap
              // where a protected path could be touched before it was rejected.
              ensure_general_file_operation_allowed(path)?;

              let metadata = fs::symlink_metadata(path).map_err(|error| {
                  if error.kind() == io::ErrorKind::NotFound {
                      FileOpError::SourceMissing.to_string()
                  } else {
                      FileOpError::Io(error).to_string()
                  }
              })?;
              if metadata.file_type().is_symlink() {
                  return Err(FileOpError::ProtectedPath(normalize_path(path)).to_string());
              }

              let source = path
                  .canonicalize()
                  .map_err(|error| FileOpError::Io(error).to_string())?;

              // Canonical protection is deliberately repeated to prevent symlink/reparse
              // aliases from escaping the lexical policy.
              ensure_general_file_operation_allowed(&source)?;
              ensure_cleanup_operation_allowed(&source, app_data_dir)?;
              Ok(source)
          }
          '''
          if old_validator not in file_ops:
              raise SystemExit("validate_cleanup_trash_source block no longer matches master")
          file_ops = file_ops.replace(old_validator, new_validator, 1)

          old_test = '''    #[test]
              fn execute_moves_core_refuses_dangerous_move_to_trash_paths() {
                  let protected_path = if cfg!(windows) {
                      "C:/Windows/System32"
                  } else if cfg!(target_os = "macos") {
                      "/System"
                  } else {
                      "/etc"
                  };
                  let result = execute_moves_core(ExecuteMovesRequest {
                      operations: vec![OperationPreviewRequest {
                          id: "trash-system".to_string(),
                          file_id: protected_path.to_string(),
                          operation_type: "move_to_trash".to_string(),
                          source_path: protected_path.to_string(),
                          target_path: "Recycle Bin".to_string(),
                          old_name: "protected-system-path".to_string(),
                          new_name: "protected-system-path".to_string(),
                          is_executable: Some(true),
                      }],
                  });

                  assert_eq!(result.logs[0].status, "failed");
                  assert!(result.logs[0]
                      .error_message
                      .as_deref()
                      .unwrap_or("")
                      .contains("protected"));
              }
          '''
          new_test = '''    #[test]
              fn cleanup_rejects_windows_system_directory_without_filesystem_access() {
                  let error = ensure_general_file_operation_allowed_for_os(
                      Path::new("C:/Windows/System32"),
                      "windows",
                  )
                  .expect_err("Windows system directories must be rejected lexically");

                  assert!(error.contains("protected system location"));
              }
          '''
          if old_test not in file_ops:
              raise SystemExit("slow System32 test block no longer matches master")
          file_ops = file_ops.replace(old_test, new_test, 1)
          file_ops_path.write_text(file_ops, encoding="utf-8")

          # 2. Add explicit fast/full performance and no-bundle build scripts.
          package_path = root / "package.json"
          package = json.loads(package_path.read_text(encoding="utf-8"))
          scripts = package["scripts"]
          scripts["build:check"] = "tauri build --features desktop-runtime --no-bundle"
          scripts["test:performance:pr"] = "node scripts/runPerformanceTestPr.mjs"
          scripts["test:performance:full"] = "node scripts/runPerformanceTest.mjs"
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          fast_perf = '''import path from "node:path";
          import { spawnSync } from "node:child_process";

          const root = process.cwd();

          function run(label, command, args, options = {}) {
            console.log(`Running ${label}...`);
            const result = spawnSync(command, args, {
              cwd: root,
              stdio: "inherit",
              ...options,
            });
            if (result.error) {
              console.error(`${label} failed to start: ${result.error.message}`);
              process.exit(1);
            }
            if (result.status !== 0) {
              console.error(`${label} failed with exit code ${result.status}.`);
              process.exit(result.status ?? 1);
            }
            console.log(`${label} passed.`);
          }

          run(
            "bounded UI behavior checks",
            process.execPath,
            [
              path.join(root, "node_modules/vitest/vitest.mjs"),
              "run",
              "tests/fileLibraryPagination.test.ts",
              "tests/virtualization.test.ts",
              "tests/searchSpotlight.test.ts",
            ],
          );

          // Keep one 100k complexity sentinel in every code PR. The remaining large
          // migration/scan/dedupe/analysis suites run for sensitive paths and master.
          run(
            "100k SQLite/FTS complexity sentinel",
            "cargo",
            [
              "test",
              "--release",
              "--manifest-path",
              "src-tauri/Cargo.toml",
              "fts_benchmark_100k",
              "--",
              "--ignored",
              "--nocapture",
            ],
          );
          '''
          (root / "scripts/runPerformanceTestPr.mjs").write_text(fast_perf, encoding="utf-8")

          ci = r'''name: CI

          on:
            pull_request:
            push:
              branches:
                - master
            schedule:
              - cron: "17 2 * * *"
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: ci-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          env:
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

          jobs:
            change-scope:
              name: Change scope / documentation contract
              runs-on: ubuntu-latest
              outputs:
                docs_only: ${{ steps.classify.outputs.docs_only }}
                performance_sensitive: ${{ steps.classify.outputs.performance_sensitive }}
                package_sensitive: ${{ steps.classify.outputs.package_sensitive }}
                diff_base: ${{ steps.classify.outputs.diff_base }}
                diff_head: ${{ steps.classify.outputs.diff_head }}
              steps:
                - name: Checkout
                  uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                  with:
                    fetch-depth: 0

                - name: Classify changed files
                  id: classify
                  shell: bash
                  env:
                    EVENT_NAME: ${{ github.event_name }}
                    PR_BASE: ${{ github.event.pull_request.base.sha }}
                    PR_HEAD: ${{ github.event.pull_request.head.sha }}
                    PUSH_BASE: ${{ github.event.before }}
                    EVENT_HEAD: ${{ github.sha }}
                  run: |
                    python3 - <<'PY'
                    import os
                    import re
                    import subprocess

                    event = os.environ["EVENT_NAME"]
                    head = os.environ.get("PR_HEAD") or os.environ["EVENT_HEAD"]
                    base = os.environ.get("PR_BASE") if event == "pull_request" else os.environ.get("PUSH_BASE")
                    forced_full = event in {"schedule", "workflow_dispatch"}
                    if not base or re.fullmatch(r"0+", base):
                        base = subprocess.check_output(
                            ["git", "rev-list", "--max-parents=0", head], text=True
                        ).splitlines()[0]

                    changed = []
                    if not forced_full:
                        output = subprocess.check_output(
                            ["git", "diff", "--name-status", "-M", base, head], text=True
                        )
                        for line in output.splitlines():
                            fields = line.split("\t")
                            if not fields:
                                continue
                            status = fields[0]
                            paths = fields[1:]
                            # Renames include both old and new names; deletions are retained.
                            if status.startswith("R") and len(paths) == 2:
                                changed.extend(paths)
                            elif paths:
                                changed.append(paths[-1])

                    def is_doc(path):
                        lower = path.lower()
                        return (
                            lower.startswith("docs/")
                            or lower.endswith((".md", ".mdx"))
                            or re.fullmatch(r"license(?:\..*)?", lower) is not None
                            or lower.startswith(".github/issue_template/")
                            or lower.startswith(".github/pull_request_template")
                        )

                    performance_prefixes = (
                        "src-tauri/src/db/",
                        "src-tauri/src/scanner/",
                        "src-tauri/src/dedupe",
                        "src-tauri/src/global_index/",
                        "src-tauri/src/analysis",
                        "src-tauri/src/storage_analyzer.rs",
                        "src-tauri/tests/migrations.rs",
                        "src-tauri/tests/fts_benchmark.rs",
                        "scripts/runperformancetest",
                        "tests/performancescript.test.ts",
                    )
                    package_prefixes = (
                        "src-tauri/tauri.conf.json",
                        "src-tauri/icons/",
                        "src-tauri/cargo.toml",
                        "package.json",
                        "package-lock.json",
                        "installer/",
                        ".github/workflows/",
                    )

                    docs_only = bool(changed) and all(is_doc(path) for path in changed)
                    performance_sensitive = forced_full or any(
                        path.lower().startswith(performance_prefixes) for path in changed
                    )
                    package_sensitive = forced_full or any(
                        path.lower().startswith(package_prefixes) for path in changed
                    )

                    values = {
                        "docs_only": str(docs_only).lower(),
                        "performance_sensitive": str(performance_sensitive).lower(),
                        "package_sensitive": str(package_sensitive).lower(),
                        "diff_base": base,
                        "diff_head": head,
                    }
                    with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
                        for key, value in values.items():
                            output_file.write(f"{key}={value}\n")
                    with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                        summary.write("## Change scope\n")
                        for key, value in values.items():
                            summary.write(f"- {key.replace('_', ' ')}: {value}\n")
                        summary.write(f"- changed paths: {len(changed)}\n")
                        for path in changed:
                            summary.write(f"  - {path}\n")
                    PY

                - name: Setup Node for documentation validation
                  if: steps.classify.outputs.docs_only == 'true'
                  uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
                  with:
                    node-version: 24

                - name: Validate documentation-only change
                  if: steps.classify.outputs.docs_only == 'true'
                  env:
                    DOCS_DIFF_BASE: ${{ steps.classify.outputs.diff_base }}
                    DOCS_DIFF_HEAD: ${{ steps.classify.outputs.diff_head }}
                  run: |
                    npm run test:docs
                    git diff --check "$DOCS_DIFF_BASE" "$DOCS_DIFF_HEAD"

            frontend-quality:
              name: Frontend and format quality
              needs: change-scope
              if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                - name: Setup Node
                  uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
                  with:
                    node-version: 24
                    cache: npm
                - name: Install dependencies
                  run: npm ci
                - name: Typecheck and frontend tests
                  run: |
                    npm run typecheck
                    npm test
                    npm run test:remediation
                - name: Rust format
                  run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

            rust-windows:
              name: Rust quality (windows-latest)
              needs: change-scope
              if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
              runs-on: windows-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                - name: Rust cache
                  uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
                  with:
                    workspaces: src-tauri -> target
                    shared-key: zen-canvas-Windows
                    cache-on-failure: true
                - name: Rust tests
                  run: cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime
                - name: Rust clippy
                  run: cargo clippy --manifest-path src-tauri/Cargo.toml --features desktop-runtime --all-targets -- -D warnings
                - name: Native filesystem hardening smoke
                  run: cargo test --manifest-path src-tauri/Cargo.toml --features "desktop-runtime native-qa" --test native_file_hardening_smoke -- --ignored --nocapture --test-threads=1

            rust-macos:
              name: Rust quality (macos-latest)
              needs: change-scope
              if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
              runs-on: macos-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                - name: Rust cache
                  uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
                  with:
                    workspaces: src-tauri -> target
                    shared-key: zen-canvas-macOS
                    cache-on-failure: true
                - name: Rust tests
                  run: cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime
                - name: Rust clippy
                  run: cargo clippy --manifest-path src-tauri/Cargo.toml --features desktop-runtime --all-targets -- -D warnings
                - name: macOS path and temp policy regression
                  run: |
                    cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime macos_
                    cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime temp_safety_tests

            performance:
              name: Performance profile
              needs: change-scope
              if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
              runs-on: windows-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                - name: Setup Node
                  uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
                  with:
                    node-version: 24
                    cache: npm
                - name: Rust cache
                  uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
                  with:
                    workspaces: src-tauri -> target
                    shared-key: zen-canvas-Windows-performance
                    cache-on-failure: true
                - name: Install dependencies
                  run: npm ci
                - name: Run selected performance profile
                  shell: pwsh
                  run: |
                    if ("${{ github.event_name }}" -ne "pull_request" -or "${{ needs.change-scope.outputs.performance_sensitive }}" -eq "true") {
                      npm run test:performance:full
                    } else {
                      npm run test:performance:pr
                    }

            build-windows:
              name: Release compile (windows-latest)
              needs: change-scope
              if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
              runs-on: windows-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                - name: Setup Node
                  uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
                  with:
                    node-version: 24
                    cache: npm
                - name: Rust cache
                  uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
                  with:
                    workspaces: src-tauri -> target
                    shared-key: zen-canvas-Windows-build
                    cache-on-failure: true
                - name: Install dependencies
                  run: npm ci
                - name: Build release application without bundle
                  run: npm run build:check

            build-macos:
              name: Release compile (macos-latest)
              needs: change-scope
              if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
              runs-on: macos-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                - name: Setup Node
                  uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
                  with:
                    node-version: 24
                    cache: npm
                - name: Rust cache
                  uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
                  with:
                    workspaces: src-tauri -> target
                    shared-key: zen-canvas-macOS-build
                    cache-on-failure: true
                - name: Install dependencies
                  run: npm ci
                - name: Build release application without bundle
                  run: npm run build:check

            package-windows:
              name: Package NSIS
              needs: change-scope
              if: ${{ needs.change-scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || needs.change-scope.outputs.package_sensitive == 'true') }}
              runs-on: windows-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                - name: Setup Node
                  uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
                  with:
                    node-version: 24
                    cache: npm
                - name: Rust cache
                  uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
                  with:
                    workspaces: src-tauri -> target
                    shared-key: zen-canvas-Windows-package
                    cache-on-failure: true
                - name: Install dependencies
                  run: npm ci
                - name: Build NSIS package
                  run: npm run build

            package-macos:
              name: Package unsigned DMG
              needs: change-scope
              if: ${{ needs.change-scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || needs.change-scope.outputs.package_sensitive == 'true') }}
              runs-on: macos-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                - name: Setup Node
                  uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
                  with:
                    node-version: 24
                    cache: npm
                - name: Rust cache
                  uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
                  with:
                    workspaces: src-tauri -> target
                    shared-key: zen-canvas-macOS-package
                    cache-on-failure: true
                - name: Install dependencies
                  run: npm ci
                - name: Build unsigned DMG
                  run: npm run build -- --no-sign

            dependency-audit:
              name: Dependency audit
              needs: change-scope
              if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
                - name: Setup Node
                  uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
                  with:
                    node-version: 24
                - name: npm audit
                  run: npm run security:audit
                - name: Install pinned cargo-audit
                  run: cargo install cargo-audit --version 0.21.2 --locked
                - name: RustSec audit
                  run: npm run security:audit:rust

            quality-windows:
              name: Quality (windows-latest)
              needs: [change-scope, frontend-quality, rust-windows, performance, build-windows, package-windows]
              if: ${{ always() && needs.change-scope.outputs.docs_only != 'true' }}
              runs-on: ubuntu-latest
              steps:
                - name: Verify Windows gate dependencies
                  env:
                    FRONTEND: ${{ needs.frontend-quality.result }}
                    RUST: ${{ needs.rust-windows.result }}
                    PERFORMANCE: ${{ needs.performance.result }}
                    BUILD: ${{ needs.build-windows.result }}
                    PACKAGE: ${{ needs.package-windows.result }}
                  run: |
                    test "$FRONTEND" = success
                    test "$RUST" = success
                    test "$PERFORMANCE" = success
                    test "$BUILD" = success
                    test "$PACKAGE" = success -o "$PACKAGE" = skipped

            quality-macos:
              name: Quality (macos-latest)
              needs: [change-scope, frontend-quality, rust-macos, build-macos, package-macos]
              if: ${{ always() && needs.change-scope.outputs.docs_only != 'true' }}
              runs-on: ubuntu-latest
              steps:
                - name: Verify macOS gate dependencies
                  env:
                    FRONTEND: ${{ needs.frontend-quality.result }}
                    RUST: ${{ needs.rust-macos.result }}
                    BUILD: ${{ needs.build-macos.result }}
                    PACKAGE: ${{ needs.package-macos.result }}
                  run: |
                    test "$FRONTEND" = success
                    test "$RUST" = success
                    test "$BUILD" = success
                    test "$PACKAGE" = success -o "$PACKAGE" = skipped
          '''
          # Remove indentation introduced by this workflow's YAML block.
          import textwrap
          (root / ".github/workflows/ci.yml").write_text(textwrap.dedent(ci), encoding="utf-8")

          docs = '''# Code pull-request CI fast path

          Code pull requests use parallel, purpose-specific jobs instead of one serial platform matrix.

          - Frontend tests, remediation contracts, and `cargo fmt` run once on Ubuntu.
          - Windows and macOS Rust validation run in parallel.
          - Ordinary PRs use the bounded performance profile plus one 100k FTS sentinel.
          - Database/search/scan/dedupe/analysis-sensitive PRs run the full performance suite.
          - Ordinary PRs compile release applications with `--no-bundle`.
          - Packaging-sensitive PRs, master pushes, nightly runs, and manual runs build NSIS and unsigned DMG packages.
          - Dependency audit runs on Ubuntu.
          - The legacy required check names `Quality (windows-latest)`, `Quality (macos-latest)`, and `Dependency audit` remain stable.

          Change classification includes added, copied, modified, renamed, type-changed, and deleted paths. A source deletion can therefore never be hidden by an accompanying documentation edit.
          '''
          (root / "docs/engineering/CODE_PR_CI_FAST_PATH.md").parent.mkdir(parents=True, exist_ok=True)
          (root / "docs/engineering/CODE_PR_CI_FAST_PATH.md").write_text(textwrap.dedent(docs), encoding="utf-8")

          # The bootstrap workflow must not survive into the pull request.
          (root / ".github/workflows/apply-code-pr-fast-path.yml").unlink()
          PY

      - name: Commit generated optimization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
