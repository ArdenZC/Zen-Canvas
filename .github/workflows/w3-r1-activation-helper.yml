name: W3-R1 activation helper

on:
  pull_request:
    types: [synchronize]
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'docs/w3-r1-close-mutate-remediation-activation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: docs/w3-r1-close-mutate-remediation-activation
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('docs/project/ROADMAP.md')
          text = p.read_text(encoding='utf-8')

          def sub_one(pattern, replacement, flags=0):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'ROADMAP: expected one match for {pattern[:120]!r}, got {count}')

          sub_one(
              r'## Latest completed wave\n\n### W3 — Preview Platform\n\nStatus: \*\*COMPLETE / CLOSED through W3-11 closeout PR #137\*\*',
              '## Current remediation\n\n### W3 — Preview Platform / W3-R1\n\nStatus: **ACTIVE — bounded post-closeout remediation**',
          )
          sub_one(
              r'W3-10  Preview Performance \+ Cross-platform QA\s+✅ PR #136\n  ↓\nW3-11  W3 Closeout\s+✅ PR #137',
              'W3-10  Preview Performance + Cross-platform QA                         ✅ PR #136\n  ↓\nW3-11  W3 Closeout                                                    ✅ PR #137\n  ↓\nW3-R1  Close → Mutate Evidence Remediation                            ACTIVE / AUTHORIZED',
          )
          sub_one(
              r'Merged through PR #136 as `master@a825f5414af274ee02712b53b60d72fe59306fea` / tree `79f1ca9a9ff97b695b1fca38090d007a1723559e`\. Reviewer PASS `#5007633103`; exact-head hosted CI `32706899339` succeeded\. Final hard evidence includes truthful bounded ZIP 20,001→20,000 inspection, six-family close→mutate/open on Windows/macOS, 100-entry mixed/latest-wins switching, repeated-cycle resource steady state, bounded Folder scale and preserved W1/W2/Query gates\. W3-10-owned exact-head local browser timing/interaction evidence passed at 1600×900 and 980×680 with frozen shell/useful p95 targets met\.\n\nPermanent-delete automation, Windows Folder directory mutation through the existing seam, native VoiceOver/Narrator and manual interactive macOS UI remain explicitly `UNVERIFIED`; historical W1 timing observations remain historical rather than being rewritten\.',
              '''Merged through PR #136 as `master@a825f5414af274ee02712b53b60d72fe59306fea` / tree `79f1ca9a9ff97b695b1fca38090d007a1723559e`. Reviewer PASS `#5007633103`; exact-head hosted CI `32706899339` succeeded. Accepted evidence includes truthful bounded ZIP 20,001→20,000 inspection, six representative byte-provider rename/move/fresh-open cases on Windows/macOS, 100-entry mixed/latest-wins switching, repeated-cycle resource steady state, bounded Folder scale and preserved W1/W2/Query gates. W3-10-owned exact-head local browser timing/interaction evidence passed at 1600×900 and 980×680 with frozen shell/useful p95 targets met.

Post-merge review of W3-11 identified that permanent-delete remained `UNVERIFIED`, so the frozen aggregate close/dispose → rename/move/delete/open HARD criterion was not fully established. W3-R1 reopens only that evidence gate. Windows Folder directory mutation remains separately platform-limited where the existing file-only seam does not permit it; native VoiceOver/Narrator and manual interactive macOS UI remain `UNVERIFIED`.''',
          )
          sub_one(
              r'#### W3-11 — Preview Platform Closeout — COMPLETE\n.*?\n\n## Future Waves',
              '''#### W3-11 — Preview Platform Closeout — MERGED / REOPENED BY W3-R1

PR #137 was docs/governance-only and added no production/config/package/schema/CI authority. Post-merge Codex review `#5009168468` / blocker `#3844601370` found a real closeout evidence inconsistency, so its COMPLETE/CLOSED conclusion is superseded until W3-R1 closes the required permanent-delete evidence.

#### W3-R1 — Close → Mutate Evidence Remediation — ACTIVE / AUTHORIZED

Taskbook: [`tasks/W3-R1-CLOSE-MUTATE-EVIDENCE-REMEDIATION-CODEX.md`](tasks/W3-R1-CLOSE-MUTATE-EVIDENCE-REMEDIATION-CODEX.md).

Scope is limited to proving the frozen close/dispose → rename/move/delete/open gate through existing mutation authority and correcting evidence classification. W4 remains inactive.

## Current

### W3-R1 bounded remediation

Status: active — W3 remediation only

W3 Preview Platform is reopened only for W3-R1. W4 Native Integration remains **NOT YET AUTHORIZED / NOT ACTIVE**. A separate reviewed activation is still required before Finder Quick Look or Windows Explorer system-host work starts. W5 remains future Release/Hardening.

## Future Waves''',
              re.S,
          )
          sub_one(r'W3 ✅ COMPLETE\n ↓\nW3-00 ✅', 'W3 REMEDIATION ACTIVE\n ↓\nW3-00 ✅')
          sub_one(
              r'W3-11 ✅ PR #137\n ↓\nBETWEEN INITIATIVES  ← CURRENT\n ↓\nW4 planned; requires separate authorization',
              'W3-11 ✅ PR #137 (closeout conclusion reopened)\n ↓\nW3-R1 ACTIVE / AUTHORIZED  ← CURRENT\n ↓\nBETWEEN INITIATIVES  (only after W3-R1 closeout)\n ↓\nW4 planned; requires separate authorization',
          )

          for stale in ['BETWEEN INITIATIVES  ← CURRENT', 'Status: **COMPLETE / CLOSED through W3-11 closeout PR #137**']:
              if stale in text:
                  raise SystemExit(f'ROADMAP stale current truth survived: {stale}')
          p.write_text(text, encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/w3-r1-activation-helper.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/ROADMAP.md .github/workflows/w3-r1-activation-helper.yml
          git commit -m "docs: finish W3-R1 remediation activation"
          git push origin HEAD:docs/w3-r1-close-mutate-remediation-activation
