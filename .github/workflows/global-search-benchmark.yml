name: Global Search synthetic benchmark

on:
  pull_request:
    paths:
      - "src-tauri/src/global_index/tests.rs"
      - "src-tauri/src/global_index/tests/global_search_benchmark.rs"
  workflow_dispatch:
    inputs:
      entries:
        description: Synthetic Global Index row count
        required: true
        type: choice
        default: "100000"
        options:
          - "100000"
          - "500000"
          - "1000000"
          - "2000000"
          - "5000000"

permissions:
  contents: read

concurrency:
  group: global-search-benchmark-${{ github.ref }}-${{ github.event_name == 'pull_request' && '100000' || inputs.entries || '100000' }}
  cancel-in-progress: false

jobs:
  synthetic-global-search:
    name: Synthetic Global Search (${{ github.event_name == 'pull_request' && '100000' || inputs.entries || '100000' }} rows)
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      ZC_GLOBAL_SEARCH_BENCHMARK_ENTRIES: ${{ github.event_name == 'pull_request' && '100000' || inputs.entries || '100000' }}
      ZC_GLOBAL_SEARCH_BENCHMARK_OUTPUT: ${{ github.workspace }}/ci-evidence/global-search-baseline.jsonl
      ZEN_CANVAS_BENCHMARK_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: zen-canvas-Windows-global-search-benchmark-v1
          cache-workspace-crates: true
          cache-targets: true
          cache-on-failure: true
      - name: Run isolated synthetic benchmark and correctness assertions
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml
          --features desktop-runtime
          --lib
          global_index::tests::global_search_benchmark::global_search_synthetic_benchmark_baseline
          -- --ignored --exact --nocapture --test-threads=1
      - name: Upload benchmark evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: global-search-baseline-${{ env.ZC_GLOBAL_SEARCH_BENCHMARK_ENTRIES }}-rows-${{ github.run_id }}
          path: ci-evidence/global-search-baseline.jsonl
          if-no-files-found: warn
          retention-days: 30
