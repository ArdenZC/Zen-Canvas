name: Remediation Patch

on:
  push:
    branches:
      - fix/system-wide-search-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/system-wide-search-hardening
          fetch-depth: 0

      - name: Apply targeted worker corrections
        shell: python
        run: |
          from pathlib import Path

          path = Path("src-tauri/src/global_index/hardened_worker.rs")
          text = path.read_text(encoding="utf-8")
          old_import = """use super::models::{\n    unix_now, ManagedScope, AI_JOB_BLOCKED_BY_POLICY, AI_JOB_CANCELED, AI_JOB_PENDING,\n};"""
          new_import = """use super::models::{unix_now, ManagedScope, AI_JOB_BLOCKED_BY_POLICY, AI_JOB_PENDING};"""
          if old_import not in text:
              raise SystemExit("expected import block not found")
          text = text.replace(old_import, new_import, 1)

          old_sql = """        WHERE global_entry_id = ?2\n          AND job_id IN (\n              SELECT id FROM ai_jobs\n              WHERE global_entry_id = ?2 AND input_fingerprint = ?4\n          )"""
          new_sql = """        WHERE global_entry_id = ?2\n          AND (\n              job_id = ?1\n              OR job_id IN (\n                  SELECT id FROM ai_jobs\n                  WHERE global_entry_id = ?2\n                    AND input_fingerprint = ?4\n                    AND status = 'canceled'\n                    AND last_error = 'duplicate_managed_scope'\n              )\n          )"""
          if old_sql not in text:
              raise SystemExit("expected item update block not found")
          path.write_text(text.replace(old_sql, new_sql, 1), encoding="utf-8")

      - name: Format Rust sources
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --emit files

      - name: Commit corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/global_index/hardened_worker.rs
          git commit -m "fix(ai): preserve completed sibling job items"
          git push origin HEAD:fix/system-wide-search-hardening
