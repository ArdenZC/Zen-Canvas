name: W5 One-shot Lock Refresh

on:
  push:
    branches:
      - fix/w5-02-release-qualification-publication-safety
    paths:
      - ".github/workflows/w5-lock-refresh.yml"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/w5-02-release-qualification-publication-safety
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Refresh only the vulnerable transitive lock entry
        shell: bash
        run: |
          set -euo pipefail
          cp package.json "$RUNNER_TEMP/package.json.before"
          npm update browserslist \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund
          cmp package.json "$RUNNER_TEMP/package.json.before"
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const entry = lock.packages?.['node_modules/browserslist'];
          if (entry?.version !== '4.28.7') {
            throw new Error(`Expected browserslist 4.28.7, got ${entry?.version ?? '<missing>'}`);
          }
          NODE
          npm audit --audit-level=high

      - name: Require lockfile-only generated diff
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "package-lock.json"
          git diff --check
          git diff -- package-lock.json

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): update browserslist security patch"
          git push origin HEAD:fix/w5-02-release-qualification-publication-safety
