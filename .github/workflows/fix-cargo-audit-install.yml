name: Fix cargo-audit installation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ci/code-pr-fast-path'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Restore compatible cargo-audit installation
        run: python3 scripts/fixCargoAuditInstall.py
      - name: Commit corrected CI workflow only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "ci: restore compatible cargo-audit version"
          git push origin HEAD:${{ github.head_ref }}
