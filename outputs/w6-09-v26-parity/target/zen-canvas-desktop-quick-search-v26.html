<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zen Canvas — Desktop Quick Search V26</title>
<style>
:root{
  --bg:#eef1f4;--surface:#fff;--text:#202733;--muted:#667181;--faint:#8b95a3;
  --divider:#dfe3e8;--selected:#e9edf1;--focus:#566f88;--shadow:0 24px 68px rgba(25,34,45,.22);
  color-scheme:light;
}
[data-theme=dark]{--bg:#15181c;--surface:#202328;--text:#edf0f5;--muted:#b9c1cb;--faint:#8792a1;--divider:#3a4048;--selected:#2d353d;--focus:#9bafc1;--shadow:0 28px 80px rgba(0,0,0,.48);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);font:13px/20px "Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;color:var(--text);display:flex;justify-content:center;align-items:flex-start;padding-top:11vh}
button,input{font:inherit;color:inherit}
.window{width:min(620px,calc(100vw - 28px));background:var(--surface);border:1px solid var(--divider);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
.search{height:54px;display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:9px;padding:0 14px;border-bottom:1px solid var(--divider)}
.search svg,.result svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.search svg{color:var(--faint)}
.search input{min-width:0;border:0;outline:0;background:transparent;font-size:14px}
.esc{font:11px/16px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--faint)}
.results{padding:6px}
.group{padding:6px 8px 3px;color:var(--faint);font-size:9.5px;line-height:14px;letter-spacing:.65px;text-transform:uppercase}
.result{width:100%;min-height:42px;border:0;border-radius:7px;background:transparent;text-align:left;display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:9px;align-items:center;padding:4px 8px}
.result.active{background:var(--selected)}
.result:focus-visible{outline:0;background:var(--selected)}
.result svg{color:var(--muted)}
.title{font-size:12.5px;line-height:18px;font-weight:600}
.sub{font-size:10.5px;line-height:15px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{font:10px/15px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--faint)}
.footer{height:32px;border-top:1px solid var(--divider);display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:var(--faint);font-size:10.5px}
.footer .state{display:flex;align-items:center;gap:6px;min-width:0}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6}
.keys{display:flex;gap:12px}
.hidden{display:none}
.empty{padding:22px 12px 24px;text-align:center;color:var(--faint);font-size:11.5px;line-height:18px}
@media(max-width:520px){body{padding-top:5vh}.window{border-radius:11px}.keys{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* V19 — calmer desktop surface */
:root{--shadow:0 18px 52px rgba(25,34,45,.18)}
[data-theme=dark]{--muted:#c1c9d3;--faint:#929daa;--divider:#3b424b;--selected:#30363e;--focus:#a5b8c9;--shadow:0 22px 62px rgba(0,0,0,.42)}
body{padding-top:10vh;letter-spacing:0}
.window{width:min(600px,calc(100vw - 28px));border-radius:12px}
.search{height:51px;padding-inline:13px;gap:8px}
.search input{font-size:13.5px}
.esc{opacity:.62}
.results{padding:5px}
.group{padding:5px 8px 2px;font-size:9px;letter-spacing:.55px}
.result{min-height:40px;border-radius:7px;padding:3px 8px;gap:8px}
.result.active{background:color-mix(in srgb,var(--selected) 90%,var(--surface))}
.title{font-size:12.5px;line-height:18px}
.sub{font-size:10.5px;line-height:15px}
.hint{opacity:.68}
.footer{height:30px;padding-inline:11px;font-size:10px}
.footer .state{opacity:.82}.keys{gap:10px}
@media(max-width:520px){body{padding-top:4vh}.window{width:calc(100vw - 18px);border-radius:10px}.footer .state{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}


/* V21 — calmer keyboard/search surface */
.result{min-height:40px}.result .meta{line-height:15px}.result.active{background:var(--selected)}
.palette-foot,.statusbar{border-color:var(--hairline,var(--divider))}.search-shell{box-shadow:0 18px 52px rgba(20,28,38,.14)}
[data-theme=dark] .search-shell{box-shadow:0 22px 64px rgba(0,0,0,.34)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* V22 — optical + state integrity */
.window{border-radius:10px;width:min(590px,calc(100vw - 28px))}
.search{height:50px}.results{padding:5px 5px 6px}.result{min-height:39px}.footer{height:29px}
[data-theme=dark] .window{border-color:#353c44}
@media(max-width:520px){.window{width:calc(100vw - 16px);border-radius:9px}}

/* V25 — align desktop quick search with the quieter in-app command surface. */
.window{width:min(584px,calc(100vw - 28px));border-radius:10px;box-shadow:0 15px 42px rgba(24,32,42,.16)}
[data-theme=dark] .window{box-shadow:0 18px 48px rgba(0,0,0,.38)}
.search{height:49px;padding-inline:13px}
.results{padding:5px}
.result{min-height:39px;border-radius:6px;padding:4px 8px}
.result.active,.result:focus-visible{background:color-mix(in srgb,var(--selected) 74%,var(--surface))}
[data-theme=dark] .result.active,[data-theme=dark] .result:focus-visible{background:#30363d}
.footer{height:28px}
@media(max-width:520px){.window{width:calc(100vw - 16px);border-radius:9px}}



/* V26 — final desktop quick-search craft alignment */
.window{width:min(576px,calc(100vw - 28px));border-radius:9px;border-color:color-mix(in srgb,var(--divider) 84%,transparent);box-shadow:0 13px 36px rgba(24,32,42,.145)}
[data-theme=dark] .window{border-color:#353c44;box-shadow:0 16px 42px rgba(0,0,0,.36)}
.search{height:48px;padding-inline:13px}
.search input{font-size:13.5px}
.group{font-size:9.75px;letter-spacing:.055em}
.results{padding:5px}
.result{min-height:38px;border-radius:6px;padding:3px 8px;gap:8px}
.result.active,.result:focus-visible{background:color-mix(in srgb,var(--selected) 68%,var(--surface))}
[data-theme=dark] .result.active,[data-theme=dark] .result:focus-visible{background:#2d343b}
.result strong{font-size:12.25px}
.result .meta{font-size:10.75px;line-height:15px}
.footer{height:27px;padding-inline:10px}
.status{font-size:10.25px}
@media(max-width:520px){.window{width:calc(100vw - 14px);border-radius:8px}}

</style>
</head>
<body>
<div class="window" id="window" role="dialog" aria-modal="true" aria-hidden="false" aria-label="Zen Canvas 桌面快捷搜索">
  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></svg>
    <input id="q" autofocus placeholder="搜索文件、文件夹和 Zen Canvas 操作" aria-label="桌面快捷搜索">
    <span class="esc">Esc</span>
  </div>
  <div class="results" id="results">
    <div class="group">文件</div>
    <button class="result active" data-result tabindex="-1"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5"/></svg><span><div class="title">Release checklist.pdf</div><div class="sub">Documents / Zen Canvas · PDF · 240 KB</div></span><span class="hint">Enter</span></button>
    <button class="result" data-result tabindex="-1"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5"/></svg><span><div class="title">Project notes.md</div><div class="sub">Documents / Zen Canvas · Markdown · 8 KB</div></span><span></span></button>
    <button class="result" data-result tabindex="-1"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3z"/></svg><span><div class="title">2026 秋季课程资料</div><div class="sub">Teaching · 文件夹</div></span><span></span></button>
    <div class="group">操作</div>
    <button class="result" data-result tabindex="-1"><svg viewBox="0 0 24 24"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6z"/></svg><span><div class="title">新建整理计划</div><div class="sub">先生成建议与安全预览</div></span><span></span></button>
    <button class="result" data-result tabindex="-1"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span><div class="title">打开历史与恢复</div><div class="sub">查看 Journal 与 Safe Trash 恢复记录</div></span><span></span></button>
    <div class="empty hidden" id="empty">没有匹配的文件或操作</div>
  </div>
  <div class="footer"><span class="state"><span class="dot"></span>Global Index 暂不可用 · 当前搜索资料库</span><span class="keys"><span>↑↓ 选择</span><span>Enter 打开</span></span></div>
</div>
<script>
const q=document.getElementById('q'),win=document.getElementById('window'),items=[...document.querySelectorAll('[data-result]')],empty=document.getElementById('empty');
let active=0;
function visibleItems(){return items.filter(x=>!x.classList.contains('hidden'))}
function setActive(i){const vis=visibleItems();if(!vis.length){items.forEach(x=>x.classList.remove('active'));return}const target=vis[(i+vis.length)%vis.length];active=items.indexOf(target);items.forEach(x=>x.classList.toggle('active',x===target))}
function filter(){const term=q.value.trim().toLowerCase();items.forEach(x=>{const show=!term||x.innerText.toLowerCase().includes(term);x.classList.toggle('hidden',!show)});const visible=visibleItems();if(visible.length)setActive(0);else items.forEach(x=>x.classList.remove('active'));empty.classList.toggle('hidden',visible.length>0);document.querySelectorAll('.group').forEach(g=>{let n=g.nextElementSibling,has=false;while(n&&!n.classList.contains('group')&&!n.classList.contains('footer')){if(n.matches?.('[data-result]')&&!n.classList.contains('hidden'))has=true;n=n.nextElementSibling}g.classList.toggle('hidden',!has)})}
function setWindowVisible(show){win.style.display=show?'block':'none';win.setAttribute('aria-hidden',String(!show));if(show)q.focus({preventScroll:true})}
function openActive(){const x=items[active];if(!x||x.classList.contains('hidden'))return;win.dataset.lastOpened=x.querySelector('.title')?.textContent||'';setWindowVisible(false)}
items.forEach(x=>x.addEventListener('click',()=>{active=items.indexOf(x);openActive()}));
q.addEventListener('input',filter);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){setWindowVisible(false);return}
  if(e.key==='Enter'&&win.style.display!=='none'){e.preventDefault();openActive();return}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const vis=visibleItems();if(!vis.length)return;let idx=vis.indexOf(items[active]);if(idx<0)idx=0;idx=(idx+(e.key==='ArrowDown'?1:-1)+vis.length)%vis.length;setActive(idx);q.focus()}
});
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.code==='Space'){e.preventDefault();setWindowVisible(true)}});
filter();q.focus();
</script>
</body></html>
